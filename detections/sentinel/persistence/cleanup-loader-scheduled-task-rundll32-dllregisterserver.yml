title: CleanUpLoader Scheduled Task Rundll32 DLLRegisterServer
id: SENT-PERS-0004
status: stable
description: Detects scheduled task creation that launches rundll32.exe with DLLRegisterServer against DLLs in suspicious user AppData\Roaming paths, aligned to Red Canary reporting on CleanUpLoader persistence.
author: Adam Ring
date: 2026-03-20
modified: 2026-03-20
logsource:
  product: windows
  service: process_creation
platform: microsoft_sentinel
query_language: kql
query: |
  DeviceProcessEvents
  | where FileName =~ "schtasks.exe"
  | where ProcessCommandLine has "/Create"
  | where ProcessCommandLine has_all ("rundll32","DllRegisterServer")
  | where ProcessCommandLine has "\\AppData\\Roaming\\"
  | project Timestamp, DeviceName, InitiatingProcessAccountName, FileName, ProcessCommandLine, InitiatingProcessFileName
severity: high
risk_score: 88
tactics:
  - Persistence
  - Execution
techniques:
  - T1053.005
  - T1218.011
kill_chain_phases:
  - Persistence
  - Execution
data_sources:
  - DeviceProcessEvents
falsepositives:
  - Rare legitimate software registration activity using rundll32 from user paths
triage:
  - Review the scheduled task name and full rundll32 command
  - Check whether the referenced DLL lives in a random or recently created AppData\Roaming folder
  - Determine whether the scheduled task name matches common CleanUpLoader patterns such as WindowsCodecs or Security Updater
  - Correlate with suspicious downloads masquerading as PuTTY, WinSCP, or Teams utilities
validation:
  - Test in a lab with a benign scheduled task that invokes rundll32 and DllRegisterServer from a user path
lifecycle: testing
owner: Detection Engineering
tags:
  - attack.persistence
  - attack.execution
  - attack.t1053.005
  - attack.t1218.011
  - cleanup-loader
  - rundll32
  - scheduled-task
  - sentinel