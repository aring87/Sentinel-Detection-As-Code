title: Suspicious Microsoft 365 Inbox Rule for Forwarding or Deletion
id: SENT-PERS-0009
status: production
description: Detects creation or modification of inbox rules that forward, redirect, delete, or hide emails in Microsoft 365, including rules that may suppress security notifications.
author: Adam Ring
date: 2026-03-25
modified: 2026-03-26
platform: microsoft_sentinel
query_language: kql
logsource:
  product: m365
  service: unified_audit_log
query: |
  OfficeActivity
  | where Operation in~ ("New-InboxRule","Set-InboxRule")
  | extend Params = tostring(Parameters)
  | where Params has_any ("ForwardTo","RedirectTo","DeleteMessage","MoveToFolder","MarkAsRead","StopProcessingRules")
  | project TimeGenerated, UserId, Operation, OfficeWorkload, ClientIP, Parameters, ResultStatus
severity: high
risk_score: 88
tactics:
  - Persistence
  - Collection
  - Defense Evasion
techniques:
  - T1114.003
  - T1564
kill_chain_phases:
  - Persistence
  - Collection
data_sources:
  - OfficeActivity
falsepositives:
  - User-created mailbox organization rules
  - Admin-created support or workflow rules
  - Approved assistant or routing automations
triage:
  - Review the rule action, targeted messages, and any external forwarding destinations
  - Determine whether the mailbox owner created or approved the rule
  - Check for suspicious sign-ins, OAuth abuse, delegation changes, or mail-access spikes
  - Identify whether security or finance-related emails were hidden, deleted, or redirected
validation:
  - Create a benign inbox rule in a test mailbox and validate audit coverage
lifecycle: production
owner: Detection Engineering
tags:
  - attack.persistence
  - attack.collection
  - attack.defense-evasion
  - attack.t1114.003
  - attack.t1564
  - m365
  - inbox-rule
  - sentinel