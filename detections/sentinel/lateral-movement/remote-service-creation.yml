title: Remote Service Creation
id: SENT-LAT-0001
status: experimental
description: Detects service control commands commonly used to create or start services on remote systems for lateral movement or remote execution.
author: Adam Ring
date: 2026-03-06
modified: 2026-03-26
platform: microsoft_sentinel
query_language: kql
logsource:
  product: windows
  category: process_creation
query: |
  DeviceProcessEvents
  | where FileName in~ ("sc.exe","psexec.exe","cmd.exe")
  | where ProcessCommandLine has "\\\\"
  | where ProcessCommandLine has_any (" create "," start "," config ")
  | project Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine, SHA1, ReportId
severity: high
risk_score: 82
tactics:
  - Lateral Movement
  - Execution
techniques:
  - T1021.002
  - T1569.002
kill_chain_phases:
  - Lateral Movement
data_sources:
  - DeviceProcessEvents
falsepositives:
  - Authorized remote administration
  - Software deployment systems
  - Patch management or endpoint management tooling
triage:
  - Identify the remote target, service name, and binary path referenced in the command
  - Validate whether the action was expected for the user, host, and time window
  - Check for prior file copy, SMB access, or administrative share usage
  - Determine whether the remote service launched a script, LOLBin, or payload from a suspicious location
validation:
  - Use sc.exe against a lab remote system to create and start a benign service
lifecycle: experimental
owner: Detection Engineering
tags:
  - attack.lateral-movement
  - attack.execution
  - attack.t1021.002
  - attack.t1569.002
  - sentinel
  - lateral-movement