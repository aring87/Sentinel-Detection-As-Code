title: Suspicious Service Creation for Elevation
id: SENT-PRIVESC-0003
status: experimental
description: Detects service creation or service configuration commands that may be used to execute code with SYSTEM privileges.
author: Adam Ring
date: 2026-03-06
modified: 2026-03-26
platform: microsoft_sentinel
query_language: kql
logsource:
  product: windows
  category: process_creation
query: |
  DeviceProcessEvents
  | where FileName in~ ("sc.exe","cmd.exe","powershell.exe","pwsh.exe")
  | where ProcessCommandLine has_any (" create ","New-Service","binPath=","Set-Service")
  | project Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine, SHA1, ReportId
severity: high
risk_score: 74
tactics:
  - Privilege Escalation
  - Persistence
techniques:
  - T1543.003
kill_chain_phases:
  - Privilege Escalation
data_sources:
  - DeviceProcessEvents
falsepositives:
  - Legitimate service deployments by administrators
  - Approved software installation workflows
  - Endpoint management or software packaging tools
triage:
  - Review the service name, binary path, and whether the path is user-writable or newly created
  - Determine whether the user should be creating or modifying services on the device
  - Correlate with file creation, service start events, and any suspicious parent process
  - Check whether the service points to LOLBins, scripts, or unsigned binaries
validation:
  - Create a benign lab service and validate the command is captured
lifecycle: experimental
owner: Detection Engineering
tags:
  - attack.privilege-escalation
  - attack.persistence
  - attack.t1543.003
  - sentinel
  - privilege-escalation