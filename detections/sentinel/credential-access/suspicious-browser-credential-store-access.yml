title: Suspicious Browser Credential Store Access
id: SENT-CRED-0003
status: experimental
description: Detects non-browser processes accessing browser credential or session storage files often targeted for credential theft.
author: Adam Ring
date: 2026-03-06
modified: 2026-03-26
platform: microsoft_sentinel
query_language: kql
logsource:
  product: windows
  category: file_event
query: |
  DeviceFileEvents
  | where FolderPath has_any ("\\Google\\Chrome\\User Data\\","\\Microsoft\\Edge\\User Data\\","\\Mozilla\\Firefox\\Profiles\\")
  | where FileName in~ ("Login Data","Cookies","Web Data","logins.json","key4.db")
  | where InitiatingProcessFileName !in~ ("chrome.exe","msedge.exe","firefox.exe","brave.exe")
  | project Timestamp, DeviceName, InitiatingProcessAccountName, InitiatingProcessFileName, InitiatingProcessCommandLine, FolderPath, FileName, SHA1, ReportId
severity: medium
risk_score: 65
tactics:
  - Credential Access
techniques:
  - T1555.003
kill_chain_phases:
  - Credential Access
data_sources:
  - DeviceFileEvents
falsepositives:
  - Approved backup, forensic, browser repair, or profile migration tooling
  - Enterprise browser management utilities
  - Security tooling inspecting browser artifacts
triage:
  - Identify the process touching the browser credential store and whether it is approved
  - Determine whether the process is signed, expected, or executing from a user-writable path
  - Review related archive creation, clipboard access, network egress, or exfiltration behavior
validation:
  - Access browser login databases from a lab script or forensics tool and compare with known admin activity
lifecycle: experimental
owner: Detection Engineering
tags:
  - attack.credential-access
  - attack.t1555.003
  - sentinel
  - browser
  - credential-access