title: Potential LSASS Memory Dump
id: SENT-CRED-0002
status: experimental
description: Detects common LSASS dumping tools, modules, and command lines used to extract credentials from memory.
author: Adam Ring
date: 2026-03-06
modified: 2026-03-26
platform: microsoft_sentinel
query_language: kql
logsource:
  product: windows
  category: process_creation
query: |
  DeviceProcessEvents
  | where ProcessCommandLine has_any ("lsass","MiniDumpWriteDump","comsvcs.dll","MiniDump","procdump","sekurlsa")
      or FileName in~ ("procdump.exe","procdump64.exe","rundll32.exe","mimikatz.exe")
  | project Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine, SHA1, ReportId
severity: high
risk_score: 85
tactics:
  - Credential Access
techniques:
  - T1003.001
kill_chain_phases:
  - Credential Access
data_sources:
  - DeviceProcessEvents
falsepositives:
  - Approved memory forensics or EDR actions
  - Authorized security testing
  - Rare support or crash-dump workflows
triage:
  - Identify the dumping utility, target process, and execution context
  - Check whether a dump file was written to disk or staged for exfiltration
  - Correlate with privilege escalation, token abuse, or lateral movement
validation:
  - Run a lab-only LSASS dump simulation and confirm telemetry
lifecycle: experimental
owner: Detection Engineering
tags:
  - attack.credential-access
  - attack.t1003.001
  - sentinel
  - lsass
  - credential-access