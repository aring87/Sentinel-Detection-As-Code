title: Device Code Phishing Followed by Graph Mail Access
id: SENT-CRED-0004
status: testing
description: Detects successful device code authentication followed by Microsoft Graph mail-access activity for the same user, which may indicate device code phishing followed by mailbox collection.
author: Adam Ring
date: 2026-03-20
modified: 2026-03-26
logsource:
  product: entra_id
  service: sign_in_and_cloud_app
platform: microsoft_sentinel
query_language: kql
query: |
  let deviceCodeSignins = SigninLogs
  | where AuthenticationProtocol =~ "deviceCode"
  | where ResultType == 0
  | extend JoinUser = tolower(UserPrincipalName)
  | where isnotempty(JoinUser)
  | project SigninTime=TimeGenerated, JoinUser, SigninIP=IPAddress, SigninApp=AppDisplayName;
  let graphMailAccess = CloudAppEvents
  | where Application == "Microsoft Graph"
  | where ActionType has_any ("MailItemsAccessed","SearchQueryPerformed","MessageBind","FileDownloaded","MailAccess")
  | extend JoinUser = tolower(tostring(AccountDisplayName))
  | where isnotempty(JoinUser)
  | project GraphTime=TimeGenerated, JoinUser, ActionType, Application, RawEventData;
  deviceCodeSignins
  | join kind=inner graphMailAccess on JoinUser
  | where GraphTime between (SigninTime .. SigninTime + 4h)
  | project SigninTime, GraphTime, JoinUser, SigninIP, SigninApp, ActionType, Application, RawEventData
severity: high
risk_score: 88
tactics:
  - Credential Access
  - Collection
techniques:
  - T1528
  - T1114
kill_chain_phases:
  - Exploitation
  - Collection
data_sources:
  - SigninLogs
  - CloudAppEvents
falsepositives:
  - Legitimate device code workflows using Graph-based mail clients
  - Approved admin, migration, or eDiscovery tooling
triage:
  - Confirm whether the user expected device code authentication
  - Review Graph activity volume and operation types after sign-in
  - Determine whether the session accessed unusual mailboxes or performed search-heavy collection
  - Check for follow-on inbox rule creation, OAuth abuse, exfiltration, or lateral phishing
validation:
  - Test with a lab Graph mail workflow after device code authentication
lifecycle: testing
owner: Detection Engineering
tags:
  - attack.credential-access
  - attack.collection
  - attack.t1528
  - attack.t1114
  - graph
  - device-code-phishing
  - sentinel