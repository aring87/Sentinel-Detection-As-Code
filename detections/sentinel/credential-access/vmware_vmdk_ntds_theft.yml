title: VMware vCenter VMDK Attach-Detach Activity Potentially Related to NTDS Theft
id: SENT-CRED-0006
status: testing
description: Detects suspicious VMware vCenter activity consistent with unmanaged VM creation, VMDK detach/attach behavior, and possible credential dumping from a virtualized domain controller.
author: Adam Ring
date: 2026-03-25
modified: 2026-03-26
platform: microsoft_sentinel
query_language: kql
logsource:
  product: vmware
  service: vcenter
query: |
  VMware_CL
  | where RawData has_any ("VMDK","vmdk","detach","attach","reconfigure","VmReconfiguredEvent","VmDiskAttachedEvent","VmDiskDetachedEvent","CreateVM","RegisterVM","PowerOnVM_Task")
  | extend LowerRaw = tolower(RawData)
  | extend SuspicionScore = 0
  | extend SuspicionScore = SuspicionScore + iff(LowerRaw has "detach",1,0)
  | extend SuspicionScore = SuspicionScore + iff(LowerRaw has "attach",1,0)
  | extend SuspicionScore = SuspicionScore + iff(LowerRaw has "vmdk",1,0)
  | extend SuspicionScore = SuspicionScore + iff(LowerRaw has "createvm" or LowerRaw has "registervm",1,0)
  | extend SuspicionScore = SuspicionScore + iff(LowerRaw has "poweronvm",1,0)
  | where SuspicionScore >= 3
  | project TimeGenerated, Computer, RawData, SuspicionScore
severity: high
risk_score: 90
tactics:
  - Credential Access
  - Defense Evasion
  - Discovery
techniques:
  - T1003.003
  - T1562
kill_chain_phases:
  - Credential Access
data_sources:
  - VMware_CL
falsepositives:
  - Legitimate VMware recovery, migration, backup, or maintenance operations
triage:
  - Review the actor, VM names, and change sequence around attach/detach events
  - Determine whether the affected VMDK belonged to a domain controller or other identity system
  - Correlate with unmanaged VM creation, registry hive access, or credential dumping activity
validation:
  - Simulate benign vCenter disk operations and compare with suspicious attach-detach sequences
lifecycle: testing
owner: Detection Engineering
tags:
  - attack.credential-access
  - attack.defense-evasion
  - attack.discovery
  - attack.t1003.003
  - attack.t1562
  - vmware
  - vcenter
  - sentinel