title: New App Secret Added Then Service Principal Sign-In
id: SENT-RESDEV-0007
status: stable
description: Detects application secret or key credential creation followed shortly by service principal sign-in, intended to surface suspicious cloud application operationalization after credential creation.
author: Adam Ring
date: 2026-03-20
modified: 2026-03-20
logsource:
  product: entra_id
  service: audit_and_sign_in
platform: microsoft_sentinel
query_language: kql
query: |
  let secretAdds = AuditLogs
  | where OperationName in~ ("Add password credential","Add key credential")
  | mv-expand TargetResources
  | extend AppName = tostring(TargetResources.displayName)
  | project SecretTime=TimeGenerated, InitiatedBy, AppName, OperationName, Result;
  let spSignins = SigninLogs
  | where Identity !contains "@"
  | where isnotempty(AppDisplayName)
  | project SigninTime=TimeGenerated, AppDisplayName, IPAddress, ResourceDisplayName, ResultType;
  secretAdds
  | join kind=inner spSignins on $left.AppName == $right.AppDisplayName
  | where SigninTime between (SecretTime .. SecretTime + 4h)
  | project SecretTime, SigninTime, AppName, OperationName, InitiatedBy, IPAddress, ResourceDisplayName, ResultType
severity: high
risk_score: 84
tactics:
  - Resource Development
  - Persistence
techniques:
  - T1528
  - T1098
kill_chain_phases:
  - Installation
  - Persistence
data_sources:
  - AuditLogs
  - SigninLogs
falsepositives:
  - Approved application onboarding and secret rotation
triage:
  - Validate whether the app owner and credential addition were approved
  - Review the timing between secret creation and service principal activity
  - Check what resources the app accessed after sign-in
  - Determine whether the app was newly created, overprivileged, or tied to suspicious consent activity
validation:
  - Test with a controlled app secret rotation and service principal sign-in
lifecycle: testing
owner: Detection Engineering
tags:
  - attack.resource-development
  - attack.persistence
  - app-secret
  - service-principal
  - entra
  - sentinel