title: Suspicious TruffleHog Secret Scanning
id: SENT-RESDEV-0005
status: stable
description: Detects TruffleHog execution from unexpected hosts or users, aligned to Red Canary reporting on the Salesloft Drift supply-chain compromise and adversary use of secret-scanning tools.
author: Adam Ring
date: 2026-03-20
modified: 2026-03-20
logsource:
  product: windows
  service: process_creation
platform: microsoft_sentinel
query_language: kql
query: |
  DeviceProcessEvents
  | where FileName in~ ("trufflehog.exe","trufflehog")
     or ProcessCommandLine has_any ("trufflehog","GetCallerIdentity","github","git","s3","blob","secrets")
  | project Timestamp,DeviceName,InitiatingProcessAccountName,InitiatingProcessFileName,FileName,ProcessCommandLine
severity: medium
risk_score: 68
tactics:
  - Resource Development
  - Credential Access
techniques:
  - T1552
  - T1580
kill_chain_phases:
  - Resource Development
  - Credential Access
data_sources:
  - DeviceProcessEvents
falsepositives:
  - Approved security engineering or DevSecOps secret-scanning
  - Internal developer security workflows
triage:
  - Validate whether TruffleHog is authorized on the device and for the initiating user
  - Review whether the command targeted repositories, cloud credentials, or secrets stores
  - Check for nearby AWS, Azure, or GitHub API activity
  - Investigate whether the execution was followed by credential use, cloud enumeration, or package publishing
validation:
  - Test with a benign TruffleHog scan in a development or lab environment
lifecycle: testing
owner: Detection Engineering
tags:
  - attack.resource-development
  - attack.credential-access
  - attack.t1552
  - attack.t1580
  - trufflehog
  - supply-chain
  - secrets
  - sentinel