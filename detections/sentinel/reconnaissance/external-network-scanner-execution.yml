title: External Network Scanner Execution
id: SENT-RECON-0001
status: experimental
description: Detects execution of common network scanning tools on endpoints, which may indicate internal or external reconnaissance activity.
author: Adam Ring
date: 2026-03-06
modified: 2026-03-26
platform: microsoft_sentinel
query_language: kql
logsource:
  product: windows
  category: process_creation
query: |
  DeviceProcessEvents
  | where FileName in~ ("nmap.exe","masscan.exe","zmap.exe","advanced_ip_scanner.exe","netscan.exe")
  | project Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine, SHA1, ReportId
severity: medium
risk_score: 58
tactics:
  - Reconnaissance
techniques:
  - T1595
kill_chain_phases:
  - Reconnaissance
data_sources:
  - DeviceProcessEvents
falsepositives:
  - Approved vulnerability management or security assessment activity
  - Authorized network troubleshooting or engineering usage
  - Internal security lab or validation hosts
triage:
  - Validate whether the scanning tool is approved for the user, host, or subnet
  - Review scan targets, flags, and whether the tool was launched from a writable or unusual path
  - Check for related DNS lookups, account discovery, remote execution, or follow-on exploitation
validation:
  - Execute an approved scanner in a lab and confirm the analytic triggers
  - Baseline sanctioned scanning hosts to support tuning
lifecycle: experimental
owner: Detection Engineering
tags:
  - attack.reconnaissance
  - attack.t1595
  - sentinel
  - reconnaissance