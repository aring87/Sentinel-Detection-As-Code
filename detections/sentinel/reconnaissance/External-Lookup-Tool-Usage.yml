title: External Lookup Tool Usage
id: SENT-RECON-0003
status: experimental
description: Detects use of DNS and WHOIS lookup utilities that may be used to gather external infrastructure details during reconnaissance.
author: Adam Ring
date: 2026-03-06
modified: 2026-03-26
platform: microsoft_sentinel
query_language: kql
logsource:
  product: windows
  category: process_creation
query: |
  DeviceProcessEvents
  | where FileName in~ ("nslookup.exe","whois.exe","dig.exe")
  | where ProcessCommandLine has_any ("-type=","/querytype","mx","txt","soa","ns","any")
  | project Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine, ReportId
severity: low
risk_score: 42
tactics:
  - Reconnaissance
techniques:
  - T1590
  - T1596
kill_chain_phases:
  - Reconnaissance
data_sources:
  - DeviceProcessEvents
falsepositives:
  - Legitimate DNS troubleshooting
  - Helpdesk or network operations lookups
  - Administrator validation of mail, TXT, or name-server records
triage:
  - Review queried domains, record types, and frequency of use
  - Determine whether the user or host normally performs external infrastructure lookups
  - Check for nearby phishing preparation, scanning, or domain-registration activity
validation:
  - Run nslookup, dig, or whois queries for MX, TXT, SOA, and NS records in a lab
lifecycle: experimental
owner: Detection Engineering
tags:
  - attack.reconnaissance
  - attack.t1590
  - attack.t1596
  - sentinel
  - reconnaissance