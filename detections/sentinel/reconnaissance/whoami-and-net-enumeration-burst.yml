title: Whoami and Net Enumeration Burst
id: SENT-RECON-0002
status: experimental
description: Detects bursts of account, trust, and environment-enumeration commands that may indicate host or domain reconnaissance.
author: Adam Ring
date: 2026-03-06
modified: 2026-03-26
platform: microsoft_sentinel
query_language: kql
logsource:
  product: windows
  category: process_creation
query: |
  DeviceProcessEvents
  | where FileName in~ ("whoami.exe","net.exe","net1.exe","nltest.exe","dsquery.exe")
  | summarize CommandCount=count(), Commands=make_set(ProcessCommandLine, 12), Procs=make_set(FileName, 10) by DeviceName, AccountName, bin(Timestamp, 10m)
  | where CommandCount >= 5
severity: medium
risk_score: 52
tactics:
  - Reconnaissance
  - Discovery
techniques:
  - T1087
  - T1016
  - T1482
kill_chain_phases:
  - Reconnaissance
data_sources:
  - DeviceProcessEvents
falsepositives:
  - Administrator troubleshooting or domain support activity
  - Automated inventory or audit scripts
  - Helpdesk account and trust verification workflows
triage:
  - Review the exact commands executed in the burst and whether they targeted local, domain, or trust information
  - Determine whether the account is expected to perform domain reconnaissance
  - Check for subsequent credential access, remote execution, or lateral movement activity
validation:
  - Run multiple whoami, net, nltest, and dsquery commands within ten minutes in a lab
  - Compare against known benign administrator activity
lifecycle: experimental
owner: Detection Engineering
tags:
  - attack.reconnaissance
  - attack.discovery
  - attack.t1087
  - attack.t1016
  - attack.t1482
  - sentinel
  - reconnaissance