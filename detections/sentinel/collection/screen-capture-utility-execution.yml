title: Suspicious Screen Capture Utility Execution
id: SENT-COLL-0003
status: experimental
description: Detects screen capture utilities or scripted screenshot behavior that may indicate collection of user session data.
author: Adam Ring
date: 2026-03-06
modified: 2026-03-26
platform: microsoft_sentinel
query_language: kql
logsource:
  product: windows
  category: process_creation
query: |
  DeviceProcessEvents
  | where FileName in~ ("psr.exe","nircmd.exe","snippingtool.exe","snipaste.exe")
      or ProcessCommandLine has_any ("screenshot","capturedesktop","saveimage","screen capture")
  | extend SuspicionScore = 0
  | extend SuspicionScore = SuspicionScore + iff(FileName in~ ("nircmd.exe","snipaste.exe"), 2, 0)
  | extend SuspicionScore = SuspicionScore + iff(ProcessCommandLine has_any ("capturedesktop","saveimage","screenshot"), 2, 0)
  | extend SuspicionScore = SuspicionScore + iff(InitiatingProcessFileName in~ ("powershell.exe","pwsh.exe","cmd.exe","wscript.exe","cscript.exe","mshta.exe"), 2, 0)
  | where SuspicionScore >= 2
  | project Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine, SHA1, ReportId, SuspicionScore
severity: medium
risk_score: 56
tactics:
  - Collection
techniques:
  - T1113
kill_chain_phases:
  - Collection
data_sources:
  - DeviceProcessEvents
falsepositives:
  - Legitimate user screenshots
  - Support, documentation, or training workflows
  - Approved remote support tooling capturing user screens
triage:
  - Validate whether screenshot usage is expected for the user, host, and time window
  - Check whether image files were written to temp, downloads, desktop, or other staging locations
  - Review for nearby exfiltration, clipboard access, browser credential access, or archiving activity
validation:
  - Launch benign screen capture utilities in a lab and compare against help desk and normal user behavior
lifecycle: experimental
owner: Detection Engineering
tags:
  - attack.collection
  - attack.t1113
  - sentinel
  - collection