title: Suspicious Fake CAPTCHA Browser-to-Script Execution Chain
id: SENT-EXEC-0004
status: experimental
description: Detects likely fake CAPTCHA or browser-lure activity followed by script interpreter or LOLBin execution from a browser context.
author: Adam Ring
date: 2026-03-25
modified: 2026-03-26
platform: microsoft_sentinel
query_language: kql
logsource:
  product: windows
  category: process_creation
query: |
  let BrowserProcs = dynamic(["chrome.exe","msedge.exe","firefox.exe","brave.exe","iexplore.exe"]);
  let ChildProcs = dynamic(["powershell.exe","pwsh.exe","cmd.exe","wscript.exe","cscript.exe","mshta.exe","rundll32.exe","regsvr32.exe"]);
  DeviceProcessEvents
  | where InitiatingProcessFileName in~ (BrowserProcs)
  | where FileName in~ (ChildProcs)
  | where ProcessCommandLine has_any ("frombase64string","invoke-expression"," iwr "," irm ","curl ","wget ","bitsadmin","javascript:","http://","https://")
  | project Timestamp, DeviceName, AccountName, InitiatingProcessFileName, InitiatingProcessCommandLine, FileName, ProcessCommandLine, SHA1, SHA256, ReportId
severity: high
risk_score: 82
tactics:
  - Initial Access
  - Execution
techniques:
  - T1204.001
  - T1059.001
  - T1059.003
kill_chain_phases:
  - Delivery
  - Execution
data_sources:
  - DeviceProcessEvents
falsepositives:
  - Administrator testing launched from a browser
  - Internal portals that intentionally launch local tools
  - Developer workflows that open scripts from browser-delivered content
triage:
  - Review the browser process, URL context, and user activity immediately before execution
  - Check whether the command line contains download, decode, or remote execution indicators
  - Determine whether the payload executed from a user-writable location or led to persistence or network egress
validation:
  - Reproduce a benign browser-to-script workflow in a lab and compare with suspicious command-line patterns
lifecycle: experimental
owner: Detection Engineering
tags:
  - attack.initial-access
  - attack.execution
  - attack.t1204.001
  - attack.t1059.001
  - attack.t1059.003
  - sentinel
  - execution