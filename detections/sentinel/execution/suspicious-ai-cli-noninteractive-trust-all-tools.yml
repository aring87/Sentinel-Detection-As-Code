title: Suspicious AI CLI Noninteractive Trust-All-Tools Execution
id: SENT-EXEC-0007
status: experimental
description: Detects noninteractive AI CLI execution patterns with trust-all-tools style flags that may enable unattended risky tool use or agentic execution.
author: Adam Ring
date: 2026-03-20
modified: 2026-03-26
platform: microsoft_sentinel
query_language: kql
logsource:
  product: windows
  category: process_creation
query: |
  DeviceProcessEvents
  | where FileName in~ ("claude.exe","claude.cmd","aider.exe","aider.cmd","cursor.exe","gemini.exe","gemini.cmd","openai.exe","openai.cmd")
      or ProcessCommandLine has_any ("claude ","aider ","cursor ","gemini ","openai ")
  | where ProcessCommandLine has_any ("--non-interactive","--yes","--force","--dangerously-skip-permissions","--trust-all-tools","--approve-all")
  | project Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine, SHA1, ReportId
severity: medium
risk_score: 68
tactics:
  - Execution
techniques:
  - T1059
kill_chain_phases:
  - Execution
data_sources:
  - DeviceProcessEvents
falsepositives:
  - Approved engineering automation using AI tooling in CI or controlled lab environments
  - Internal development workflows with sanctioned noninteractive agents
triage:
  - Determine whether the host is an approved engineering or lab asset
  - Review whether the tool executed with broad approval flags or unattended permissions
  - Check for follow-on file modification, code execution, credential access, or network egress
validation:
  - Run a benign AI CLI in a lab with noninteractive flags and compare with expected developer workflows
lifecycle: experimental
owner: Detection Engineering
tags:
  - attack.execution
  - attack.t1059
  - sentinel
  - execution
  - ai-cli