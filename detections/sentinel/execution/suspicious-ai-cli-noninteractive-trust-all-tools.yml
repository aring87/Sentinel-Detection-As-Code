title: Suspicious AI CLI Non-Interactive Trust-All-Tools Execution
id: SENT-EXEC-0005
status: experimental
description: Detects potentially risky AI CLI execution patterns such as non-interactive sessions with trust-all-tools semantics or MCP-related tooling, aligned to Red Canary reporting on threats to AI infrastructure and prompt-injection-driven agent abuse.
author: Adam Ring
date: 2026-03-20
modified: 2026-03-20
logsource:
  product: windows
  service: process_creation
platform: microsoft_sentinel
query_language: kql
query: |
  DeviceProcessEvents
  | where FileName in~ ("q.exe","claude.exe","claude-code.exe","cursor.exe","code.exe","node.exe","python.exe")
  | where ProcessCommandLine has_any ("--trust-all-tools","--no-interactive","mcp","model context protocol","amazon q","claude code")
  | project Timestamp,DeviceName,InitiatingProcessAccountName,InitiatingProcessFileName,FileName,ProcessCommandLine
severity: high
risk_score: 74
tactics:
  - Execution
  - Initial Access
techniques:
  - T1059
  - T1195
kill_chain_phases:
  - Execution
  - Initial Access
data_sources:
  - DeviceProcessEvents
falsepositives:
  - Approved AI engineering workflows
  - Development labs testing MCP servers or AI CLI tooling
triage:
  - Review whether the host is an approved AI development or engineering system
  - Validate whether the command included non-interactive or trust-all-tools semantics
  - Check for access to code repositories, secrets, or sensitive data sources after execution
  - Review network destinations and spawned child processes for prompt-injection or agent hijacking indicators
validation:
  - Test in a lab with approved AI CLI tooling and tune for sanctioned engineering hosts
lifecycle: experimental
owner: Detection Engineering
tags:
  - attack.execution
  - attack.initial-access
  - attack.t1059
  - attack.t1195
  - ai-cli
  - mcp
  - prompt-injection
  - sentinel