title: Malicious Copy and Paste PowerShell from Explorer
id: SENT-EXEC-0004
status: stable
description: Detects likely paste-and-run or FileFix-style execution where explorer launches PowerShell, CMD, or LOLBins with suspicious download, hidden, or obfuscated arguments. Inspired by Red Canary reporting on Malicious Copy and Paste / paste-and-run campaigns.
author: Adam Ring
date: 2026-03-20
modified: 2026-03-20
logsource:
  product: windows
  service: process_creation
platform: microsoft_sentinel
query_language: kql
query: |
  DeviceProcessEvents
  | where FileName in~ ("powershell.exe","pwsh.exe","cmd.exe","wscript.exe","cscript.exe","mshta.exe","rundll32.exe")
  | where InitiatingProcessFileName =~ "explorer.exe"
  | where ProcessCommandLine has_any ("curl ","iwr ","irm ","downloadstring","frombase64string","-enc","-encodedcommand","hidden","invoke-expression","iex ","mshta ","javascript:")
  | project Timestamp,DeviceName,InitiatingProcessAccountName,InitiatingProcessFileName,FileName,ProcessCommandLine,InitiatingProcessCommandLine
severity: high
risk_score: 78
tactics:
  - Execution
techniques:
  - T1059
  - T1204
kill_chain_phases:
  - Execution
data_sources:
  - DeviceProcessEvents
falsepositives:
  - Administrator launching scripts manually from Explorer
  - Internal troubleshooting workflows using PowerShell from the Run dialog
triage:
  - Review the full ProcessCommandLine for download, obfuscation, or hidden execution patterns
  - Determine whether the user was likely interacting with a browser-based lure or fake verification prompt
  - Check for recent browser activity, clipboard-related alerts, or suspicious child process chains
  - Review whether the command downloaded or launched follow-on payloads such as RMM tools or stealers
validation:
  - Test with Atomic Red Team or a benign PowerShell command launched from the Run dialog that mimics paste-and-run flow
lifecycle: testing
owner: Detection Engineering
tags:
  - attack.execution
  - attack.t1059
  - attack.t1204
  - paste-and-run
  - clickfix
  - fakecaptcha
  - sentinel