title: Cloud Backup or Storage Mass Delete Burst
id: SENT-IMPACT-0004
status: testing
description: Detects bursts of cloud storage or backup deletion activity that may indicate destructive cloud impact or anti-recovery actions.
author: Adam Ring
date: 2026-03-20
modified: 2026-03-26
platform: microsoft_sentinel
query_language: kql
logsource:
  product: cloud
  service: administrative_activity
query: |
  union isfuzzy=true
  (
    AzureActivity
    | where OperationNameValue has_any ("Microsoft.Storage/storageAccounts/delete","Microsoft.RecoveryServices/vaults/delete","Microsoft.Compute/snapshots/delete")
    | summarize DeleteCount=count(), Ops=make_set(OperationNameValue,20) by bin(TimeGenerated, 30m), Caller, ResourceGroup
    | where DeleteCount >= 3
    | project TimeGenerated, Actor=Caller, Scope=ResourceGroup, Source="AzureActivity", DeleteCount, Ops
  ),
  (
    CloudAppEvents
    | where ActionType has_any ("DeleteBucket","DeleteObject","DeleteSnapshot","DeleteBackupVault","DeleteStorageAccount")
    | summarize DeleteCount=count(), Ops=make_set(ActionType,20) by bin(TimeGenerated, 30m), AccountDisplayName, Application
    | where DeleteCount >= 5
    | project TimeGenerated, Actor=AccountDisplayName, Scope=Application, Source="CloudAppEvents", DeleteCount, Ops
  )
severity: high
risk_score: 90
tactics:
  - Impact
techniques:
  - T1485
  - T1490
kill_chain_phases:
  - Actions on Objectives
data_sources:
  - AzureActivity
  - CloudAppEvents
falsepositives:
  - Planned decommissioning or cleanup work
  - Approved lifecycle automation
  - Authorized cloud retention or teardown workflows
triage:
  - Confirm whether storage accounts, snapshots, buckets, or backup vaults were deleted in bulk
  - Validate whether the actor is expected to perform destructive cloud administration
  - Review preceding public access changes, immutability removal, or credential abuse
  - Check whether ransomware or extortion-related behavior is also present
validation:
  - Test controlled snapshot, storage, or vault deletion activity in a cloud lab
lifecycle: testing
owner: Detection Engineering
tags:
  - attack.impact
  - attack.t1485
  - attack.t1490
  - cloud
  - backup-destruction
  - sentinel