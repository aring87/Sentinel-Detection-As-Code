title: Net User Enumeration
id: SENT-DISC-0005
status: experimental
description: Detects use of net.exe or net1.exe to enumerate user accounts.
author: Adam Ring
date: 2026-03-26
modified: 2026-03-26
platform: microsoft_sentinel
query_language: kql
logsource:
  product: windows
  category: process_creation
query: |
  DeviceProcessEvents
  | where FileName in~ ("net.exe","net1.exe")
  | where ProcessCommandLine has "user"
  | project Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine, ReportId
severity: medium
risk_score: 50
tactics:
  - Discovery
techniques:
  - T1087.001
kill_chain_phases:
  - Discovery
data_sources:
  - DeviceProcessEvents
falsepositives:
  - Helpdesk or administrative account troubleshooting
  - Inventory or support scripts
  - Lab validation activity
triage:
  - Review whether the host and user normally perform account enumeration
  - Check for other discovery commands, LDAP queries, or failed-logon patterns nearby
  - Determine whether the command targeted local or domain account listings
validation:
  - Run net user commands in a lab and compare with admin activity
lifecycle: experimental
owner: Detection Engineering
tags:
  - attack.discovery
  - attack.t1087.001
  - sentinel
  - discovery