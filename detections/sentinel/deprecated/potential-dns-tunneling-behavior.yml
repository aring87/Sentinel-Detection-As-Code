title: Potential DNS Tunneling Behavior
id: SENT-C2-0001
status: experimental
description: Detects excessive or unusually long DNS query patterns from a single process that may indicate DNS tunneling or beaconing.
author: Adam Ring
date: 2026-03-06
modified: 2026-03-26
platform: microsoft_sentinel
query_language: kql
logsource:
  product: windows
  category: network
query: |
  DeviceNetworkEvents
  | where RemotePort == 53
  | where isnotempty(RemoteUrl)
  | extend QueryLength = strlen(RemoteUrl)
  | where InitiatingProcessFileName !in~ ("chrome.exe","msedge.exe","firefox.exe","svchost.exe")
  | summarize QueryCount=count(), AvgQueryLength=avg(QueryLength), MaxQueryLength=max(QueryLength), SampleQueries=make_set(RemoteUrl,10) by DeviceName, InitiatingProcessFileName, InitiatingProcessCommandLine, bin(Timestamp, 15m)
  | where QueryCount >= 100 and AvgQueryLength >= 40
severity: high
risk_score: 78
tactics:
  - Command and Control
techniques:
  - T1071.004
kill_chain_phases:
  - Command and Control
data_sources:
  - DeviceNetworkEvents
falsepositives:
  - DNS-heavy security or diagnostic tools
  - Internal testing that generates repetitive long DNS queries
  - Specialized applications using unusual DNS patterns
triage:
  - Review the process generating the DNS traffic and its execution path
  - Determine whether the queried domains and subdomain lengths are abnormal for the host
  - Check for TXT-heavy behavior, repeated long labels, or suspicious parent processes
  - Correlate with follow-on script execution, persistence, or external network traffic
validation:
  - Replay DNS tunneling lab traffic or generate long repetitive queries in a controlled environment
lifecycle: experimental
owner: Detection Engineering
tags:
  - attack.command-and-control
  - attack.t1071.004
  - sentinel
  - dns
  - command-and-control