title: OneDrive File Upload Activity
id: SENT-EXFIL-0008
status: experimental
description: Detects OneDrive file upload activity that may support exfiltration when correlated with risky sign-ins, archive creation, or unusual endpoint behavior.
author: Adam Ring
date: 2026-03-26
modified: 2026-03-26
platform: microsoft_sentinel
query_language: kql
logsource:
  product: m365
  category: onedrive_activity
query: |
  CloudAppEvents
  | where Application == "OneDrive"
  | where ActionType has "FileUploaded"
  | project Timestamp, AccountObjectId, AccountDisplayName, Application, ActionType, ObjectName, IPAddress, RawEventData
severity: medium
risk_score: 55
tactics:
  - Exfiltration
techniques:
  - T1567.002
kill_chain_phases:
  - Exfiltration
data_sources:
  - CloudAppEvents
falsepositives:
  - Normal user collaboration and synchronization
  - Approved business uploads
triage:
  - Determine whether the uploads are unusual for the user or host
  - Review whether risky sign-ins, archive creation, or bulk file access occurred beforehand
  - Check whether the destination context is expected
validation:
  - Upload a benign file to a test OneDrive account and compare with normal user behavior
lifecycle: experimental
owner: Detection Engineering
tags:
  - attack.exfiltration
  - attack.t1567.002
  - sentinel
  - onedrive
  - exfiltration