title: Quick Assist Followed by WinSCP or Google Drive Exfiltration Activity
id: SENT-EXFIL-0009
status: testing
description: Detects a likely vishing-driven intrusion chain where Microsoft Quick Assist is followed by WinSCP execution or Google Drive access from the same device shortly after remote access.
author: Adam Ring
date: 2026-03-25
modified: 2026-03-26
platform: microsoft_sentinel
query_language: kql
logsource:
  product: windows
  category: process_creation_and_network
query: |
  let qa_window = 30m;
  let QA =
    DeviceProcessEvents
    | where FileName in~ ("QuickAssist.exe","QuickAssistLauncher.exe")
    | project QAStart=Timestamp, DeviceId, DeviceName, QAAccount=AccountName, QACommand=ProcessCommandLine;
  let WinSCP =
    DeviceProcessEvents
    | where FileName in~ ("WinSCP.exe","winscp.com")
    | project WTime=Timestamp, DeviceId, WinProc=FileName, WinCmd=ProcessCommandLine;
  let GDrive =
    DeviceNetworkEvents
    | where RemoteUrl has_any ("drive.google.com","docs.google.com")
    | project GTime=Timestamp, DeviceId, RemoteUrl, InitiatingProcessFileName, InitiatingProcessCommandLine;
  QA
  | join kind=leftouter WinSCP on DeviceId
  | where isnotempty(WTime) and WTime between (QAStart .. QAStart + qa_window)
  | project Timestamp=QAStart, DeviceName, QAAccount, QACommand, FollowOnTime=WTime, FollowOnType="WinSCP", Evidence=WinCmd
  | union (
      QA
      | join kind=leftouter GDrive on DeviceId
      | where isnotempty(GTime) and GTime between (QAStart .. QAStart + qa_window)
      | project Timestamp=QAStart, DeviceName, QAAccount, QACommand, FollowOnTime=GTime, FollowOnType="GoogleDrive", Evidence=strcat(InitiatingProcessFileName," | ",InitiatingProcessCommandLine," | ",RemoteUrl)
    )
  | order by Timestamp desc
severity: high
risk_score: 88
tactics:
  - Initial Access
  - Exfiltration
techniques:
  - T1219
  - T1105
  - T1567.002
kill_chain_phases:
  - Delivery
  - Exfiltration
data_sources:
  - DeviceProcessEvents
  - DeviceNetworkEvents
falsepositives:
  - Legitimate remote support followed by approved file transfer
  - Help desk activity
  - Sanctioned admin workflows using Quick Assist and cloud storage
triage:
  - Confirm whether the Quick Assist session was approved and user-initiated
  - Review what was transferred via WinSCP or whether browser/cloud activity suggests upload to Google Drive
  - Check for follow-on collection, archive creation, credential theft, or persistence
  - Correlate with social-engineering indicators, phone support scams, or suspicious browser sessions
validation:
  - Simulate a benign Quick Assist session followed by approved file transfer and compare timing and process context
lifecycle: testing
owner: Detection Engineering
tags:
  - attack.initial-access
  - attack.exfiltration
  - attack.t1219
  - attack.t1105
  - attack.t1567.002
  - quickassist
  - winscp
  - google-drive
  - sentinel