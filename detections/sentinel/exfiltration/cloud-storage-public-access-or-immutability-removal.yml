title: Cloud Storage Public Access or Immutability Removal
id: SENT-EXFIL-0005
status: stable
description: Detects cloud storage configuration changes that may enable exfiltration or destructive follow-on activity, including enabling public access, disabling firewalls, or removing immutability protections. Inspired by Red Canary reporting on Data from Cloud Storage.
author: Adam Ring
date: 2026-03-20
modified: 2026-03-20
logsource:
  product: cloud
  service: administrative_activity
platform: microsoft_sentinel
query_language: kql
query: |
  union isfuzzy=true
  (
    AzureActivity
    | where OperationNameValue has_any ("Microsoft.Storage/storageAccounts/write","Microsoft.Storage/storageAccounts/blobServices/containers/write","Microsoft.Storage/storageAccounts/blobServices/write")
    | where Properties has_any ("allowBlobPublicAccess","publicAccess","networkAcls","defaultAction","immutability","legalHold","allowSharedKeyAccess")
    | project TimeGenerated, SourceTable="AzureActivity", Caller, ResourceGroup, ResourceProvider, OperationNameValue, Properties, ActivityStatusValue
  ),
  (
    CloudAppEvents
    | where ActionType has_any ("SetBucketAcl","PutBucketAcl","PutBucketPolicy","UpdateStorageAccount","SetPublicAccess","RemoveImmutabilityPolicy","DeleteImmutabilityPolicy")
    | project TimeGenerated, SourceTable="CloudAppEvents", AccountDisplayName, Application, ActionType, RawEventData
  )
severity: high
risk_score: 86
tactics:
  - Exfiltration
  - Impact
techniques:
  - T1567
  - T1485
kill_chain_phases:
  - Exfiltration
  - Actions on Objectives
data_sources:
  - AzureActivity
  - CloudAppEvents
falsepositives:
  - Approved storage administration changes
  - Planned migrations or controlled public-sharing changes
triage:
  - Determine whether public access, firewall exceptions, or immutability settings were changed
  - Validate whether the caller is an authorized cloud administrator
  - Review whether AzCopy, cloud CLI tools, or unusual data access followed the change
  - Check whether backup or recovery protections were weakened before destructive actions
validation:
  - Test with a lab storage account by modifying public access or immutability controls
lifecycle: testing
owner: Detection Engineering
tags:
  - attack.exfiltration
  - attack.impact
  - attack.t1567
  - cloud-storage
  - immutability
  - public-access
  - sentinel