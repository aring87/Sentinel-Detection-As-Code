title: Potential Spearphishing Attachment Execution
id: SENT-INIT-0003
status: experimental
description: Detects Office applications spawning script interpreters or LOLBins shortly after opening files from user download, temp, or cache paths.
author: Adam Ring
date: 2026-03-06
modified: 2026-03-26
platform: microsoft_sentinel
query_language: kql
logsource:
  product: windows
  category: process_creation
query: |
  DeviceProcessEvents
  | where InitiatingProcessFileName in~ ("winword.exe","excel.exe","powerpnt.exe","outlook.exe")
  | where FileName in~ ("powershell.exe","cmd.exe","mshta.exe","wscript.exe","cscript.exe","rundll32.exe")
  | where InitiatingProcessFolderPath has_any ("Downloads","AppData\\Local\\Temp","INetCache")
  | project Timestamp, DeviceName, AccountName, InitiatingProcessFileName, InitiatingProcessFolderPath, FileName, ProcessCommandLine, InitiatingProcessCommandLine, SHA1, ReportId
severity: high
risk_score: 80
tactics:
  - Initial Access
  - Execution
techniques:
  - T1566.001
kill_chain_phases:
  - Delivery
  - Execution
data_sources:
  - DeviceProcessEvents
falsepositives:
  - Approved macro-enabled business workflows
  - Internal automation launched through Office
  - Security testing with malicious-document simulations
triage:
  - Review the parent Office process, opened document path, and child process tree
  - Check for downloads, external URLs, macro indicators, or script launch behavior
  - Investigate the source email, attachment name, and sender context
  - Determine whether additional persistence or credential access occurred afterward
validation:
  - Open a benign macro-enabled test document in a lab and compare with normal Office behavior
lifecycle: experimental
owner: Detection Engineering
tags:
  - attack.initial-access
  - attack.execution
  - attack.t1566.001
  - sentinel
  - initial-access