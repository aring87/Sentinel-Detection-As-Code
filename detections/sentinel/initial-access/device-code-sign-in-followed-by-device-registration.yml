title: Device Code Sign-In Followed by Device Registration
id: SENT-INIT-0004
status: testing
description: Detects successful device code authentication followed closely by new device registration activity for the same user, which may indicate device code phishing followed by actor-controlled device enrollment.
author: Adam Ring
date: 2026-03-20
modified: 2026-03-26
platform: microsoft_sentinel
query_language: kql
logsource:
  product: entra_id
  service: sign_in_and_cloud_app
query: |
  let deviceCodeSignins =
    SigninLogs
    | where AuthenticationProtocol =~ "deviceCode"
    | where ResultType == 0
    | extend JoinUser = tolower(UserPrincipalName)
    | where isnotempty(JoinUser)
    | project SigninTime=TimeGenerated, JoinUser, IPAddress, AppDisplayName, CorrelationId;
  let deviceRegistrations =
    CloudAppEvents
    | where AccountDisplayName == "Device Registration Service" or Application =~ "Device Registration Service"
    | extend JoinUser = tolower(tostring(RawEventData.ObjectId))
    | extend DeviceName = tostring(parse_json(tostring(RawEventData.ModifiedProperties))[1].NewValue)
    | extend DeviceObjectId = tostring(parse_json(tostring(RawEventData.ModifiedProperties))[0].NewValue)
    | where isnotempty(JoinUser)
    | project RegistrationTime=TimeGenerated, JoinUser, DeviceName, DeviceObjectId, Application, RawEventData;
  deviceCodeSignins
  | join kind=inner deviceRegistrations on JoinUser
  | where RegistrationTime between (SigninTime .. SigninTime + 2h)
  | project SigninTime, RegistrationTime, JoinUser, IPAddress, AppDisplayName, DeviceName, DeviceObjectId, Application, CorrelationId, RawEventData
severity: high
risk_score: 90
tactics:
  - Initial Access
  - Credential Access
techniques:
  - T1566
  - T1528
kill_chain_phases:
  - Delivery
  - Exploitation
data_sources:
  - SigninLogs
  - CloudAppEvents
falsepositives:
  - Legitimate device code enrollment scenarios
  - Approved device registration workflows
  - Lab validation of device registration flows
triage:
  - Confirm whether the user expected a device code prompt
  - Review the source IP, app, and any unusual proxy, ASN, or geography signals
  - Validate whether the registered device is known, corporate-owned, and expected
  - Check for follow-on mailbox, SharePoint, Teams, or Graph API access after registration
validation:
  - Test with a lab device code sign-in and controlled device registration workflow
lifecycle: testing
owner: Detection Engineering
tags:
  - attack.initial-access
  - attack.credential-access
  - attack.t1566
  - attack.t1528
  - device-code-phishing
  - entra
  - prt
  - sentinel