title: Device Code Sign-In Followed by Device Registration
id: SENT-INIT-0004
status: stable
description: Detects device code authentication followed closely by a new device registration event for the same user, aligned to Microsoft reporting on Storm-2372 abuse of device code flow to obtain refresh tokens, register actor-controlled devices, and obtain PRT-backed access.
author: Adam Ring
date: 2026-03-20
modified: 2026-03-20
logsource:
  product: entra_id
  service: sign_in_and_cloud_app
platform: microsoft_sentinel
query_language: kql
query: |
  let deviceCodeSignins = SigninLogs
  | where AuthenticationProtocol =~ "deviceCode"
  | where ResultType == 0
  | extend UserPrincipalName = tolower(UserPrincipalName)
  | project SigninTime=TimeGenerated, UserPrincipalName, IPAddress, AppDisplayName, CorrelationId;
  let deviceRegistrations = CloudAppEvents
  | where AccountDisplayName == "Device Registration Service"
  | extend UserPrincipalName = tolower(tostring(RawEventData.ObjectId))
  | extend DeviceName = tostring(parse_json(tostring(RawEventData.ModifiedProperties))[1].NewValue)
  | extend DeviceObjectId = tostring(parse_json(tostring(RawEventData.ModifiedProperties))[0].NewValue)
  | project RegistrationTime=TimeGenerated, UserPrincipalName, DeviceName, DeviceObjectId, Application
  ;
  deviceCodeSignins
  | join kind=inner deviceRegistrations on UserPrincipalName
  | where RegistrationTime between (SigninTime .. SigninTime + 2h)
  | project SigninTime, RegistrationTime, UserPrincipalName, IPAddress, AppDisplayName, DeviceName, DeviceObjectId, Application, CorrelationId
severity: high
risk_score: 90
tactics:
  - Initial Access
  - Credential Access
techniques:
  - T1566
  - T1528
kill_chain_phases:
  - Delivery
  - Exploitation
data_sources:
  - SigninLogs
  - CloudAppEvents
falsepositives:
  - Legitimate device code enrollment scenarios
  - Approved device registration workflows
triage:
  - Confirm whether the user expected a device code prompt
  - Review the source IP, app, and any unusual proxy or geography signals
  - Validate whether the registered device is known, corporate-owned, and expected
  - Check for follow-on mailbox, SharePoint, Teams, or Graph API access after registration
validation:
  - Test with a lab device code sign-in and controlled device registration workflow
lifecycle: testing
owner: Detection Engineering
tags:
  - attack.initial-access
  - attack.credential-access
  - device-code-phishing
  - entra
  - prt
  - sentinel