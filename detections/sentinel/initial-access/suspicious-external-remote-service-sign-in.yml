title: Suspicious External Remote Service Sign-In
id: SENT-INIT-0002
status: experimental
description: Detects successful external sign-ins to remote access or administrative services that may represent abuse of external remote services.
author: Adam Ring
date: 2026-03-06
modified: 2026-03-26
platform: microsoft_sentinel
query_language: kql
logsource:
  product: azure
  category: authentication
query: |
  SigninLogs
  | where ResultType == 0
  | where not(ipv4_is_private(IPAddress))
  | where AppDisplayName has_any ("Azure Portal","Windows Sign In","VPN","Remote Desktop")
  | project TimeGenerated, UserPrincipalName, IPAddress, AppDisplayName, Location, ConditionalAccessStatus, RiskLevelAggregated, UserAgent
severity: high
risk_score: 70
tactics:
  - Initial Access
techniques:
  - T1133
kill_chain_phases:
  - Initial Access
data_sources:
  - SigninLogs
falsepositives:
  - Authorized travel or remote administration
  - Known VPN gateways or managed remote services
  - Contractor or support access from approved locations
triage:
  - Review location, device, and identity risk context
  - Compare the sign-in to the user's normal baseline
  - Correlate with endpoint remote access events, device registration, or mailbox access
  - Determine whether the source IP maps to expected VPN, cloud, or remote support infrastructure
validation:
  - Validate against known remote access scenarios and public-IP sign-in baselines in your environment
lifecycle: experimental
owner: Detection Engineering
tags:
  - attack.initial-access
  - attack.t1133
  - sentinel
  - initial-access