title: Suspicious Web Download via Certutil or Bitsadmin
id: SENT-C2-0003
status: experimental
description: Detects built-in Windows utilities downloading remote content, a common pattern for staging payloads, tooling, or command-and-control infrastructure.
author: Adam Ring
date: 2026-03-06
modified: 2026-03-26
platform: microsoft_sentinel
query_language: kql
logsource:
  product: windows
  category: process_creation
query: |
  DeviceProcessEvents
  | where FileName in~ ("certutil.exe","bitsadmin.exe")
  | where ProcessCommandLine has_any ("http://","https://","/transfer","/addfile","-urlcache","download")
  | project Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine, SHA1, ReportId
severity: high
risk_score: 75
tactics:
  - Command and Control
  - Execution
techniques:
  - T1105
kill_chain_phases:
  - Command and Control
data_sources:
  - DeviceProcessEvents
falsepositives:
  - Approved software distribution or update tasks
  - Administrator troubleshooting downloads
  - Legacy scripts using built-in transfer utilities
triage:
  - Review the remote URL, destination path, and whether the file was later executed
  - Determine whether the command is part of approved admin workflow
  - Check for execution from temp, downloads, ProgramData, or other user-writable locations
validation:
  - Use certutil or bitsadmin to download a benign file in a lab and compare with known admin behavior
lifecycle: experimental
owner: Detection Engineering
tags:
  - attack.command-and-control
  - attack.execution
  - sentinel
  - certutil
  - bitsadmin
  - command-and-control