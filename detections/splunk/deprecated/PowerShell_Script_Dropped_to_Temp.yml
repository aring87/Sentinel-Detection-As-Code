title: PowerShell Script Dropped to Temp Directory
id: SPLK-EXEC-0003
source_id: SENT-EXEC-0003
status: experimental
description: Detects PowerShell creating or dropping script files into a user or system temporary directory, which may indicate staged execution, payload delivery, or script-based malware activity.
author: Adam Ring
date: '2025-07-31'
modified: '2026-03-06'
platform: splunk
query_language: spl
logsource:
  product: windows
  category: file_event
source_table: DeviceFileEvents
search: '`microsoft_defender_device_file_events`

  | where FolderPath has @"AppData\Local\Temp"

  | where like(lower(FileName), "%.ps1") OR like(lower(FileName), "%.psm1")

  | where InitiatingProcessFileName = "powershell.exe"

  | table Timestamp, DeviceName, InitiatingProcessAccountName, InitiatingProcessFileName, FileName, FolderPath

  | eval __translation_note="Residual KQL syntax remains. Manual review required."'
how_to_implement:
- Create or adapt the macro `microsoft_defender_device_file_events` to point to the relevant Splunk index, sourcetype, or datamodel.
- Validate field names against your Splunk data source because this conversion preserves many original Sentinel field names where possible.
- Tune thresholds, lookback windows, and suppressions in the target Splunk environment before production enablement.
severity: high
risk_score: 70
tactics:
- Execution
techniques:
- T1059.001
kill_chain_phases:
- Execution
data_sources:
- DeviceFileEvents
falsepositives:
- Administrative scripts written to temp during troubleshooting or automation
- Software packaging or update workflows that stage PowerShell modules in temp paths
triage:
- Review the full temp file path and filename for suspicious naming patterns
- Identify the creating PowerShell process and associated user context
- Determine whether the script was subsequently executed
- Review related process, file, and network activity on the same host
validation:
- Test by writing benign PowerShell scripts to a temp directory from PowerShell
- Validate whether common administrative tooling generates expected benign hits
- Confirm the analytic captures useful file path and account context
lifecycle: experimental
owner: Detection Engineering
tags:
- attack.execution
- attack.t1059.001
- ckc.execution
- powershell
- temp-directory
- script-drop
- sentinel
- splunk
- converted-from-sentinel
