title: Potential DNS Tunneling Behavior
id: SPLK-C2-0001
source_id: SENT-C2-0001
status: experimental
description: Detects excessive or unusually long DNS query patterns from a single process that may indicate DNS tunneling or beaconing.
author: Adam Ring
date: '2026-03-06'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: windows
  category: network
source_table: DeviceNetworkEvents
search: '`microsoft_defender_device_network_events`

  | where RemotePort=53

  | where isnotnull(RemoteUrl) AND RemoteUrl!=""

  | eval QueryLength=strlen(RemoteUrl)

  | where InitiatingProcessFileName !in~ ("chrome.exe","msedge.exe","firefox.exe","svchost.exe")

  | bin Timestamp span=15m | stats count as QueryCount, AvgQueryLength=avg(QueryLength), MaxQueryLength=max(QueryLength), values(RemoteUrl) as SampleQueries by DeviceName, InitiatingProcessFileName, InitiatingProcessCommandLine, Timestamp

  | where QueryCount >= 100 AND AvgQueryLength >= 40'
how_to_implement:
- Create or adapt the macro `microsoft_defender_device_network_events` to point to the relevant Splunk index, sourcetype, or datamodel.
- Validate field names against your Splunk data source because this conversion preserves many original Sentinel field names where possible.
- Tune thresholds, lookback windows, and suppressions in the target Splunk environment before production enablement.
severity: high
risk_score: 78
tactics:
- Command and Control
techniques:
- T1071.004
kill_chain_phases:
- Command and Control
data_sources:
- DeviceNetworkEvents
falsepositives:
- DNS-heavy security or diagnostic tools
- Internal testing that generates repetitive long DNS queries
- Specialized applications using unusual DNS patterns
triage:
- Review the process generating the DNS traffic and its execution path
- Determine whether the queried domains and subdomain lengths are abnormal for the host
- Check for TXT-heavy behavior, repeated long labels, or suspicious parent processes
- Correlate with follow-on script execution, persistence, or external network traffic
validation:
- Replay DNS tunneling lab traffic or generate long repetitive queries in a controlled environment
lifecycle: experimental
owner: Detection Engineering
tags:
- attack.command-and-control
- attack.t1071.004
- sentinel
- dns
- command-and-control
- splunk
- converted-from-sentinel
