title: System and Network Configuration Discovery
id: SPLK-DISC-0002
source_id: SENT-DISC-0002
status: production
description: Detects common commands used to gather host, network, and interface information in a short burst.
author: Adam Ring
date: '2026-03-06'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: windows
  category: process_creation
source_table: DeviceProcessEvents
search: '`microsoft_defender_device_process_events`

  | where FileName IN ("ipconfig.exe", "arp.exe", "route.exe", "systeminfo.exe", "netstat.exe", "getmac.exe", "hostname.exe")

  | bin Timestamp span=10m | stats count as CommandCount, values(ProcessCommandLine) as Commands by DeviceName, AccountName, Timestamp

  | where CommandCount >= 4'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: medium
risk_score: 50
tactics:
- Discovery
techniques:
- T1016
- T1082
- T1049
kill_chain_phases:
- Discovery
data_sources:
- DeviceProcessEvents
falsepositives:
- Troubleshooting by support teams
- Asset inventory or diagnostics tooling
- Administrator host triage
triage:
- Inspect the burst of discovery commands and the operator account
- Determine whether the host is a workstation, server, or admin jump box
- Review follow-on remote execution, credential access, or staging activity
validation:
- Run multiple discovery commands within ten minutes in a lab
lifecycle: production
owner: Detection Engineering
tags:
- attack.discovery
- attack.t1016
- attack.t1082
- attack.t1049
- sentinel
- discovery
- splunk
- converted-from-sentinel
production_tuning:
- Validate macro scope, time range, and field aliases in a non-production search head first.
- Tune known-good parent processes, service accounts, management hosts, and software deployment workflows.
- Where count thresholds exist, baseline by business unit or asset class before enabling notable actions.
