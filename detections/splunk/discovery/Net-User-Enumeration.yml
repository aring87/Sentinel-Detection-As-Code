title: Net User Enumeration
id: SPLK-DISC-0005
source_id: SENT-DISC-0005
status: production
description: Detects use of net.exe or net1.exe to enumerate user accounts.
author: Adam Ring
date: '2026-03-26'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: windows
  category: process_creation
source_table: DeviceProcessEvents
search: '`microsoft_defender_device_process_events`

  | where FileName IN ("net.exe", "net1.exe")

  | where like(lower(ProcessCommandLine), "%user%")

  | table Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine, ReportId'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: medium
risk_score: 50
tactics:
- Discovery
techniques:
- T1087.001
kill_chain_phases:
- Discovery
data_sources:
- DeviceProcessEvents
falsepositives:
- Helpdesk or administrative account troubleshooting
- Inventory or support scripts
- Lab validation activity
triage:
- Review whether the host and user normally perform account enumeration
- Check for other discovery commands, LDAP queries, or failed-logon patterns nearby
- Determine whether the command targeted local or domain account listings
validation:
- Run net user commands in a lab and compare with admin activity
lifecycle: production
owner: Detection Engineering
tags:
- attack.discovery
- attack.t1087.001
- sentinel
- discovery
- splunk
- converted-from-sentinel
production_tuning:
- Validate macro scope, time range, and field aliases in a non-production search head first.
- Tune known-good parent processes, service accounts, management hosts, and software deployment workflows.
- Where count thresholds exist, baseline by business unit or asset class before enabling notable actions.
