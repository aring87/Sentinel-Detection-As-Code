title: Net Group and Domain Trust Discovery
id: SPLK-DISC-0001
source_id: SENT-DISC-0001
status: production
description: Detects use of built-in tools to enumerate group membership, domain trust, and domain information.
author: Adam Ring
date: '2026-03-06'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: windows
  category: process_creation
source_table: DeviceProcessEvents
search: '`microsoft_defender_device_process_events`

  | where FileName IN ("net.exe", "net1.exe", "nltest.exe", "dsquery.exe", "whoami.exe")

  | where like(lower(ProcessCommandLine), "%group%") OR like(lower(ProcessCommandLine), "%localgroup%") OR like(lower(ProcessCommandLine), "%/domain%") OR like(lower(ProcessCommandLine), "%/all_trusts%") OR like(lower(ProcessCommandLine), "%/trusted_domains%") OR like(lower(ProcessCommandLine), "%/user%")

  | table Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine, ReportId'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: medium
risk_score: 55
tactics:
- Discovery
techniques:
- T1069
- T1482
- T1087
kill_chain_phases:
- Discovery
data_sources:
- DeviceProcessEvents
falsepositives:
- Domain administration and helpdesk support
- Inventory or audit scripts
triage:
- Review the exact group or trust discovery commands
- Determine whether the user normally performs domain reconnaissance
- Check for concurrent lateral movement or credential access
validation:
- Run net group, nltest, dsquery, and whoami discovery commands in a lab
lifecycle: production
owner: Detection Engineering
tags:
- attack.discovery
- attack.t1069
- attack.t1482
- attack.t1087
- sentinel
- discovery
- splunk
- converted-from-sentinel
production_tuning:
- Validate macro scope, time range, and field aliases in a non-production search head first.
- Tune known-good parent processes, service accounts, management hosts, and software deployment workflows.
- Where count thresholds exist, baseline by business unit or asset class before enabling notable actions.
