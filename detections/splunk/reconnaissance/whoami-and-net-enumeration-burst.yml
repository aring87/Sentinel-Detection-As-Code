title: Whoami and Net Enumeration Burst
id: SPLK-RECON-0002
source_id: SENT-RECON-0002
status: production
description: Detects bursts of account, trust, and environment-enumeration commands that may indicate host or domain reconnaissance.
author: Adam Ring
date: '2026-03-06'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: windows
  category: process_creation
source_table: DeviceProcessEvents
search: '`microsoft_defender_device_process_events`

  | where FileName IN ("whoami.exe", "net.exe", "net1.exe", "nltest.exe", "dsquery.exe")

  | bin Timestamp span=10m | stats count as CommandCount, values(ProcessCommandLine) as Commands, values(FileName) as Procs by DeviceName, AccountName, Timestamp

  | where CommandCount >= 5'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: medium
risk_score: 52
tactics:
- Reconnaissance
- Discovery
techniques:
- T1087
- T1016
- T1482
kill_chain_phases:
- Reconnaissance
data_sources:
- DeviceProcessEvents
falsepositives:
- Administrator troubleshooting or domain support activity
- Automated inventory or audit scripts
- Helpdesk account and trust verification workflows
triage:
- Review the exact commands executed in the burst and whether they targeted local, domain, or trust information
- Determine whether the account is expected to perform domain reconnaissance
- Check for subsequent credential access, remote execution, or lateral movement activity
validation:
- Run multiple whoami, net, nltest, and dsquery commands within ten minutes in a lab
- Compare against known benign administrator activity
lifecycle: production
owner: Detection Engineering
tags:
- attack.reconnaissance
- attack.discovery
- attack.t1087
- attack.t1016
- attack.t1482
- sentinel
- reconnaissance
- splunk
- converted-from-sentinel
production_tuning:
- Validate macro scope, time range, and field aliases in a non-production search head first.
- Tune known-good parent processes, service accounts, management hosts, and software deployment workflows.
- Where count thresholds exist, baseline by business unit or asset class before enabling notable actions.
