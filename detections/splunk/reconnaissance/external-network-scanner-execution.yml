title: External Network Scanner Execution
id: SPLK-RECON-0001
source_id: SENT-RECON-0001
status: production
description: Detects execution of common network scanning tools on endpoints, which may indicate internal or external reconnaissance activity.
author: Adam Ring
date: '2026-03-06'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: windows
  category: process_creation
source_table: DeviceProcessEvents
search: '`microsoft_defender_device_process_events`

  | where FileName IN ("nmap.exe", "masscan.exe", "zmap.exe", "advanced_ip_scanner.exe", "netscan.exe")

  | table Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine, SHA1, ReportId'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: medium
risk_score: 58
tactics:
- Reconnaissance
techniques:
- T1595
kill_chain_phases:
- Reconnaissance
data_sources:
- DeviceProcessEvents
falsepositives:
- Approved vulnerability management or security assessment activity
- Authorized network troubleshooting or engineering usage
- Internal security lab or validation hosts
triage:
- Validate whether the scanning tool is approved for the user, host, or subnet
- Review scan targets, flags, and whether the tool was launched from a writable or unusual path
- Check for related DNS lookups, account discovery, remote execution, or follow-on exploitation
validation:
- Execute an approved scanner in a lab and confirm the analytic triggers
- Baseline sanctioned scanning hosts to support tuning
lifecycle: production
owner: Detection Engineering
tags:
- attack.reconnaissance
- attack.t1595
- sentinel
- reconnaissance
- splunk
- converted-from-sentinel
production_tuning:
- Validate macro scope, time range, and field aliases in a non-production search head first.
- Tune known-good parent processes, service accounts, management hosts, and software deployment workflows.
- Where count thresholds exist, baseline by business unit or asset class before enabling notable actions.
