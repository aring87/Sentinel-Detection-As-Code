title: External Lookup Tool Usage
id: SPLK-RECON-0003
source_id: SENT-RECON-0003
status: production
description: Detects use of DNS and WHOIS lookup utilities that may be used to gather external infrastructure details during reconnaissance.
author: Adam Ring
date: '2026-03-06'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: windows
  category: process_creation
source_table: DeviceProcessEvents
search: '`microsoft_defender_device_process_events`

  | where FileName IN ("nslookup.exe", "whois.exe", "dig.exe")

  | where like(lower(ProcessCommandLine), "%-type=%") OR like(lower(ProcessCommandLine), "%/querytype%") OR like(lower(ProcessCommandLine), "%mx%") OR like(lower(ProcessCommandLine), "%txt%") OR like(lower(ProcessCommandLine), "%soa%") OR like(lower(ProcessCommandLine), "%ns%") OR like(lower(ProcessCommandLine), "%any%")

  | table Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine, ReportId'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: low
risk_score: 42
tactics:
- Reconnaissance
techniques:
- T1590
- T1596
kill_chain_phases:
- Reconnaissance
data_sources:
- DeviceProcessEvents
falsepositives:
- Legitimate DNS troubleshooting
- Helpdesk or network operations lookups
- Administrator validation of mail, TXT, or name-server records
triage:
- Review queried domains, record types, and frequency of use
- Determine whether the user or host normally performs external infrastructure lookups
- Check for nearby phishing preparation, scanning, or domain-registration activity
validation:
- Run nslookup, dig, or whois queries for MX, TXT, SOA, and NS records in a lab
lifecycle: production
owner: Detection Engineering
tags:
- attack.reconnaissance
- attack.t1590
- attack.t1596
- sentinel
- reconnaissance
- splunk
- converted-from-sentinel
production_tuning:
- Validate macro scope, time range, and field aliases in a non-production search head first.
- Tune known-good parent processes, service accounts, management hosts, and software deployment workflows.
- Where count thresholds exist, baseline by business unit or asset class before enabling notable actions.
