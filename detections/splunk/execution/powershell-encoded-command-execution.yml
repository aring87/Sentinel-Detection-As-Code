title: PowerShell Encoded Command Execution
id: SPLK-EXEC-0001
source_id: SENT-EXEC-0001
status: production
description: Detects PowerShell execution with -enc or EncodedCommand arguments and attempts to decode the payload for analyst review.
author: Adam Ring
date: '2026-03-06'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: windows
  category: process_creation
source_table: DeviceProcessEvents
search: '`microsoft_defender_device_process_events`

  | eval file_l=lower(FileName), cmd_l=lower(ProcessCommandLine)

  | where file_l IN ("powershell.exe","pwsh.exe")

  | where like(cmd_l, "%-enc %") OR like(cmd_l, "%-encodedcommand%")

  | rex field=ProcessCommandLine "(?:-enc|-encodedcommand)\s+(?<Encoded>[A-Za-z0-9+/=]+)"

  | eval Decoded="[optional: decode Encoded with a custom eval function, external lookup, or SOAR playbook]"

  | table Timestamp DeviceName AccountName FileName ProcessCommandLine InitiatingProcessFileName InitiatingProcessCommandLine Encoded Decoded SHA1 ReportId'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: high
risk_score: 75
tactics:
- Execution
techniques:
- T1059.001
kill_chain_phases:
- Execution
data_sources:
- DeviceProcessEvents
falsepositives:
- Approved administrative automation using encoded PowerShell
- Software deployment tooling
- Internal packaging or orchestration frameworks
triage:
- Review the decoded command for download, credential access, persistence, or defense-evasion behavior
- Validate the account, device, parent process, and execution path
- Correlate with related file, registry, and network events
validation:
- Run benign encoded PowerShell commands in a lab and confirm decoding behavior
lifecycle: production
owner: Detection Engineering
tags:
- attack.execution
- attack.t1059.001
- sentinel
- execution
- splunk
- converted-from-sentinel
production_tuning:
- Validate macro scope, time range, and field aliases in a non-production search head first.
- Tune known-good parent processes, service accounts, management hosts, and software deployment workflows.
- Where count thresholds exist, baseline by business unit or asset class before enabling notable actions.
