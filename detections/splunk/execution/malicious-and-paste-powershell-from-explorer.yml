title: Paste-and-Run Shell or Script Execution from Explorer
id: SPLK-EXEC-0005
source_id: SENT-EXEC-0005
status: production
description: Detects likely copy-paste execution behavior launched from Explorer or shell context into PowerShell, CMD, or common script interpreters.
author: Adam Ring
date: '2026-03-20'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: windows
  category: process_creation
source_table: DeviceProcessEvents
search: '`microsoft_defender_device_process_events`

  | eval parent_l=lower(InitiatingProcessFileName), file_l=lower(FileName), cmd_l=lower(ProcessCommandLine)

  | where parent_l="explorer.exe"

  | where file_l IN ("powershell.exe","pwsh.exe","cmd.exe","wscript.exe","cscript.exe","mshta.exe","rundll32.exe")

  | where like(cmd_l, "%http://%") OR like(cmd_l, "%https://%") OR like(cmd_l, "%-enc%") OR like(cmd_l, "%-encodedcommand%") OR like(cmd_l, "%frombase64string%") OR like(cmd_l, "%invoke-expression%") OR like(cmd_l, "% iwr %") OR like(cmd_l, "% irm %") OR like(cmd_l, "%curl %") OR like(cmd_l, "%wget %") OR like(cmd_l, "%javascript:%") OR like(cmd_l, "%cmd /c%") OR like(cmd_l, "%powershell -%")

  | table Timestamp DeviceName AccountName InitiatingProcessFileName InitiatingProcessCommandLine FileName ProcessCommandLine SHA1 SHA256 ReportId'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: high
risk_score: 80
tactics:
- Execution
techniques:
- T1059
- T1204.001
kill_chain_phases:
- Execution
data_sources:
- DeviceProcessEvents
falsepositives:
- Administrator troubleshooting from Explorer shell context
- Developer testing of shell commands
- Approved internal tools launched interactively by users
triage:
- Manual validation is still required for this rule because the original KQL relied on complex joins, dynamic arrays, or source-specific cloud fields.
- Review whether the user was instructed to paste a command into Run, PowerShell, or CMD
- Inspect the command for download, decode, or remote execution behavior
- Check for nearby browser activity, fake CAPTCHA lures, helpdesk scams, or Quick Assist sessions
validation:
- Launch benign PowerShell or CMD commands from Explorer and compare with suspicious paste-and-run patterns
lifecycle: production
owner: Detection Engineering
tags:
- attack.execution
- attack.t1059
- attack.t1204.001
- sentinel
- execution
- splunk
- converted-from-sentinel
production_tuning:
- Validate macro scope, time range, and field aliases in a non-production search head first.
- Tune known-good parent processes, service accounts, management hosts, and software deployment workflows.
- Where count thresholds exist, baseline by business unit or asset class before enabling notable actions.
