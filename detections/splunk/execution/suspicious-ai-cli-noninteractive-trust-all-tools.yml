title: Suspicious AI CLI Noninteractive Trust-All-Tools Execution
id: SPLK-EXEC-0007
source_id: SENT-EXEC-0007
status: production
description: Detects noninteractive AI CLI execution patterns with trust-all-tools style flags that may enable unattended risky tool use or agentic execution.
author: Adam Ring
date: '2026-03-20'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: windows
  category: process_creation
source_table: DeviceProcessEvents
search: '`microsoft_defender_device_process_events`

  | where FileName IN ("claude.exe", "claude.cmd", "aider.exe", "aider.cmd", "cursor.exe", "gemini.exe", "gemini.cmd", "openai.exe", "openai.cmd")

  | where like(lower(ProcessCommandLine), "%--non-interactive%") OR like(lower(ProcessCommandLine), "%--yes%") OR like(lower(ProcessCommandLine), "%--force%") OR like(lower(ProcessCommandLine), "%--dangerously-skip-permissions%") OR like(lower(ProcessCommandLine), "%--trust-all-tools%") OR like(lower(ProcessCommandLine), "%--approve-all%")

  | table Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine, SHA1, ReportId'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: medium
risk_score: 68
tactics:
- Execution
techniques:
- T1059
kill_chain_phases:
- Execution
data_sources:
- DeviceProcessEvents
falsepositives:
- Approved engineering automation using AI tooling in CI or controlled lab environments
- Internal development workflows with sanctioned noninteractive agents
triage:
- Determine whether the host is an approved engineering or lab asset
- Review whether the tool executed with broad approval flags or unattended permissions
- Check for follow-on file modification, code execution, credential access, or network egress
validation:
- Run a benign AI CLI in a lab with noninteractive flags and compare with expected developer workflows
lifecycle: production
owner: Detection Engineering
tags:
- attack.execution
- attack.t1059
- sentinel
- execution
- ai-cli
- splunk
- converted-from-sentinel
production_tuning:
- Validate macro scope, time range, and field aliases in a non-production search head first.
- Tune known-good parent processes, service accounts, management hosts, and software deployment workflows.
- Where count thresholds exist, baseline by business unit or asset class before enabling notable actions.
