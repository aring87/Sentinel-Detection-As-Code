title: Remote Service Creation
id: SPLK-LAT-0001
source_id: SENT-LAT-0001
status: production
description: Detects service control commands commonly used to create or start services on remote systems for lateral movement or remote execution.
author: Adam Ring
date: '2026-03-06'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: windows
  category: process_creation
source_table: DeviceProcessEvents
search: '`microsoft_defender_device_process_events`

  | where FileName IN ("sc.exe", "psexec.exe", "cmd.exe")

  | where like(lower(ProcessCommandLine), "%\\\\%")

  | where like(lower(ProcessCommandLine), "% create %") OR like(lower(ProcessCommandLine), "% start %") OR like(lower(ProcessCommandLine), "% config %")

  | table Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine, SHA1, ReportId'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: high
risk_score: 82
tactics:
- Lateral Movement
- Execution
techniques:
- T1021.002
- T1569.002
kill_chain_phases:
- Lateral Movement
data_sources:
- DeviceProcessEvents
falsepositives:
- Authorized remote administration
- Software deployment systems
- Patch management or endpoint management tooling
triage:
- Identify the remote target, service name, and binary path referenced in the command
- Validate whether the action was expected for the user, host, and time window
- Check for prior file copy, SMB access, or administrative share usage
- Determine whether the remote service launched a script, LOLBin, or payload from a suspicious location
validation:
- Use sc.exe against a lab remote system to create and start a benign service
lifecycle: production
owner: Detection Engineering
tags:
- attack.lateral-movement
- attack.execution
- attack.t1021.002
- attack.t1569.002
- sentinel
- lateral-movement
- splunk
- converted-from-sentinel
production_tuning:
- Validate macro scope, time range, and field aliases in a non-production search head first.
- Tune known-good parent processes, service accounts, management hosts, and software deployment workflows.
- Where count thresholds exist, baseline by business unit or asset class before enabling notable actions.
