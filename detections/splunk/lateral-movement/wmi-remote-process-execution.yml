title: WMI Remote Process Execution
id: SPLK-LAT-0003
source_id: SENT-LAT-0003
status: production
description: Detects use of WMIC or PowerShell WMI calls to spawn processes on remote systems.
author: Adam Ring
date: '2026-03-06'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: windows
  category: process_creation
source_table: DeviceProcessEvents
search: '`microsoft_defender_device_process_events`

  | where FileName IN ("wmic.exe", "powershell.exe", "pwsh.exe")

  | where like(lower(ProcessCommandLine), "%process call create%") OR like(lower(ProcessCommandLine), "%invoke-wmimethod%") OR like(lower(ProcessCommandLine), "%win32_process%") OR like(lower(ProcessCommandLine), "%-computername%")

  | table Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine, SHA1, ReportId'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: high
risk_score: 80
tactics:
- Lateral Movement
- Execution
techniques:
- T1047
kill_chain_phases:
- Lateral Movement
data_sources:
- DeviceProcessEvents
falsepositives:
- Systems management and admin automation
- Remote inventory or patching activity
- Approved support tooling using WMI for execution
triage:
- Review the target host and command executed remotely
- Determine whether WMI is commonly used by administrators on this device or by this account
- Check for remote logon, SMB copy, or service/task creation activity nearby
- Review whether the spawned command launched PowerShell, CMD, LOLBins, or payloads from writable paths
validation:
- Run benign remote WMI process creation in a lab and verify telemetry
lifecycle: production
owner: Detection Engineering
tags:
- attack.lateral-movement
- attack.execution
- attack.t1047
- sentinel
- lateral-movement
- splunk
- converted-from-sentinel
production_tuning:
- Validate macro scope, time range, and field aliases in a non-production search head first.
- Tune known-good parent processes, service accounts, management hosts, and software deployment workflows.
- Where count thresholds exist, baseline by business unit or asset class before enabling notable actions.
