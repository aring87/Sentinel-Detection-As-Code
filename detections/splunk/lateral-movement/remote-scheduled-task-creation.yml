title: Remote Scheduled Task Creation
id: SPLK-LAT-0002
source_id: SENT-LAT-0002
status: production
description: Detects schtasks-based remote task creation that may indicate lateral movement or remote execution.
author: Adam Ring
date: '2026-03-06'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: windows
  category: process_creation
source_table: DeviceProcessEvents
search: '`microsoft_defender_device_process_events`

  | where FileName = "schtasks.exe"

  | where ProcessCommandLine has_all ("/create","/s")

  | table Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine, SHA1, ReportId'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: high
risk_score: 78
tactics:
- Lateral Movement
techniques:
- T1053.005
- T1021
kill_chain_phases:
- Lateral Movement
data_sources:
- DeviceProcessEvents
falsepositives:
- Approved administration or orchestration platforms
- Enterprise job scheduling across managed servers
- Software deployment tooling using remote scheduled tasks
triage:
- Identify the remote target specified with /s and the task name or action
- Determine whether the account normally creates tasks on remote hosts
- Review whether the command launched script interpreters, LOLBins, or payloads from writable paths
- Correlate with remote logons, SMB access, WMI usage, or service creation nearby
validation:
- Create a benign remote scheduled task in a controlled lab and verify telemetry
lifecycle: production
owner: Detection Engineering
tags:
- attack.lateral-movement
- attack.t1053.005
- attack.t1021
- sentinel
- lateral-movement
- splunk
- converted-from-sentinel
production_tuning:
- Validate macro scope, time range, and field aliases in a non-production search head first.
- Tune known-good parent processes, service accounts, management hosts, and software deployment workflows.
- Where count thresholds exist, baseline by business unit or asset class before enabling notable actions.
