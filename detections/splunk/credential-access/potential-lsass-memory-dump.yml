title: Potential LSASS Memory Dump
id: SPLK-CRED-0002
source_id: SENT-CRED-0002
status: production
description: Detects common LSASS dumping tools, modules, and command lines used to extract credentials from memory.
author: Adam Ring
date: '2026-03-06'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: windows
  category: process_creation
source_table: DeviceProcessEvents
search: '`microsoft_defender_device_process_events`

  | where like(lower(ProcessCommandLine), "%lsass%") OR like(lower(ProcessCommandLine), "%minidumpwritedump%") OR like(lower(ProcessCommandLine), "%comsvcs.dll%") OR like(lower(ProcessCommandLine), "%minidump%") OR like(lower(ProcessCommandLine), "%procdump%") OR like(lower(ProcessCommandLine), "%sekurlsa%")

  | table Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine, SHA1, ReportId'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: high
risk_score: 85
tactics:
- Credential Access
techniques:
- T1003.001
kill_chain_phases:
- Credential Access
data_sources:
- DeviceProcessEvents
falsepositives:
- Approved memory forensics or EDR actions
- Authorized security testing
- Rare support or crash-dump workflows
triage:
- Identify the dumping utility, target process, and execution context
- Check whether a dump file was written to disk or staged for exfiltration
- Correlate with privilege escalation, token abuse, or lateral movement
validation:
- Run a lab-only LSASS dump simulation and confirm telemetry
lifecycle: production
owner: Detection Engineering
tags:
- attack.credential-access
- attack.t1003.001
- sentinel
- lsass
- credential-access
- splunk
- converted-from-sentinel
production_tuning:
- Validate macro scope, time range, and field aliases in a non-production search head first.
- Tune known-good parent processes, service accounts, management hosts, and software deployment workflows.
- Where count thresholds exist, baseline by business unit or asset class before enabling notable actions.
