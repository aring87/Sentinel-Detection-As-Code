title: Potential NTLM Enumeration via Failed Logons
id: SPLK-CRED-0001
source_id: SENT-CRED-0001
status: production
description: Detects spikes in failed NTLM authentication attempts from a single source that may indicate account enumeration, password spraying, or credential discovery activity.
author: Adam Ring
date: '2026-03-06'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: windows
  category: authentication
source_table: IdentityLogonEvents
search: '`microsoft_defender_identity_logon_events`

  | where Protocol = "NTLM" AND ActionType = "LogonFailed"

  | bin Timestamp span=15m | stats count as Failures, dc(AccountUpn) as Accounts by DeviceName, IPAddress, Timestamp

  | where Failures >= 50 AND Accounts >= 10'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: high
risk_score: 78
tactics:
- Credential Access
- Reconnaissance
techniques:
- T1110.003
- T1087
kill_chain_phases:
- Credential Access
data_sources:
- IdentityLogonEvents
falsepositives:
- Misconfigured services or stale credentials
- Password spray simulations in authorized testing
- Legacy systems repeatedly attempting invalid NTLM authentication
triage:
- Review the source IP, source device, and targeted accounts
- Determine whether the source host is compromised, scanning, or misconfigured
- Check for successful logons after the failed attempts
- Review nearby account lockouts, interactive logons, or lateral movement attempts
validation:
- Replay representative NTLM failure telemetry or simulate spray activity in a lab
lifecycle: production
owner: Detection Engineering
tags:
- attack.credential-access
- attack.reconnaissance
- attack.t1110.003
- attack.t1087
- sentinel
- credential-access
- splunk
- converted-from-sentinel
production_tuning:
- Validate macro scope, time range, and field aliases in a non-production search head first.
- Tune known-good parent processes, service accounts, management hosts, and software deployment workflows.
- Where count thresholds exist, baseline by business unit or asset class before enabling notable actions.
