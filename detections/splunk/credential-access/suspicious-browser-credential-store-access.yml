title: Suspicious Browser Credential Store Access
id: SPLK-CRED-0003
source_id: SENT-CRED-0003
status: production
description: Detects non-browser processes accessing browser credential or session storage files often targeted for credential theft.
author: Adam Ring
date: '2026-03-06'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: windows
  category: file_event
source_table: DeviceFileEvents
search: '`microsoft_defender_device_file_events`

  | where like(lower(FolderPath), "%\\google\\chrome\\user data\\%") OR like(lower(FolderPath), "%\\microsoft\\edge\\user data\\%") OR like(lower(FolderPath), "%\\mozilla\\firefox\\profiles\\%")

  | where FileName IN ("Login Data", "Cookies", "Web Data", "logins.json", "key4.db")

  | where NOT lower(InitiatingProcessFileName) IN ("chrome.exe", "msedge.exe", "firefox.exe", "brave.exe")

  | table Timestamp, DeviceName, InitiatingProcessAccountName, InitiatingProcessFileName, InitiatingProcessCommandLine, FolderPath, FileName, SHA1, ReportId'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: medium
risk_score: 65
tactics:
- Credential Access
techniques:
- T1555.003
kill_chain_phases:
- Credential Access
data_sources:
- DeviceFileEvents
falsepositives:
- Approved backup, forensic, browser repair, or profile migration tooling
- Enterprise browser management utilities
- Security tooling inspecting browser artifacts
triage:
- Identify the process touching the browser credential store and whether it is approved
- Determine whether the process is signed, expected, or executing from a user-writable path
- Review related archive creation, clipboard access, network egress, or exfiltration behavior
validation:
- Access browser login databases from a lab script or forensics tool and compare with known admin activity
lifecycle: production
owner: Detection Engineering
tags:
- attack.credential-access
- attack.t1555.003
- sentinel
- browser
- credential-access
- splunk
- converted-from-sentinel
production_tuning:
- Validate macro scope, time range, and field aliases in a non-production search head first.
- Tune known-good parent processes, service accounts, management hosts, and software deployment workflows.
- Where count thresholds exist, baseline by business unit or asset class before enabling notable actions.
