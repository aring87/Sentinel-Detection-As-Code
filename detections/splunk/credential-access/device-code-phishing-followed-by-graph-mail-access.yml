title: Device Code Phishing Followed by Graph Mail Access
id: SPLK-CRED-0004
source_id: SENT-CRED-0004
status: production
description: Detects successful device code authentication followed by Microsoft Graph mail-access activity for the same user, which may indicate device code phishing followed by mailbox collection.
author: Adam Ring
date: '2026-03-20'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: entra_id
  service: sign_in_and_cloud_app
source_table: SigninLogs
search: '`azure_signinlogs`

  | where AuthenticationProtocol = "deviceCode"

  | where ResultType=0

  | eval JoinUser=lower(UserPrincipalName)

  | where isnotnull(JoinUser) AND JoinUser!=""

  | rename TimeGenerated as SigninTime

  | rename IPAddress as SigninIP

  | rename AppDisplayName as SigninApp

  | table SigninTime, JoinUser, SigninIP, SigninApp

  | join type=inner JoinUser [

  `microsoft_defender_cloud_app_events`

  | where Application="Microsoft Graph"

  | where like(lower(ActionType), "%mailitemsaccessed%") OR like(lower(ActionType), "%searchqueryperformed%") OR like(lower(ActionType), "%messagebind%") OR like(lower(ActionType), "%filedownloaded%") OR like(lower(ActionType), "%mailaccess%")

  | eval JoinUser=lower(AccountDisplayName)

  | where isnotnull(JoinUser) AND JoinUser!=""

  | rename TimeGenerated as GraphTime

  | table GraphTime, JoinUser, ActionType, Application, RawEventData

  ]

  | where (GraphTime>=SigninTime AND GraphTime<=relative_time(SigninTime, "+4h"))

  | table SigninTime, GraphTime, JoinUser, SigninIP, SigninApp, ActionType, Application, RawEventData'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: high
risk_score: 88
tactics:
- Credential Access
- Collection
techniques:
- T1528
- T1114
kill_chain_phases:
- Exploitation
- Collection
data_sources:
- SigninLogs
- CloudAppEvents
falsepositives:
- Legitimate device code workflows using Graph-based mail clients
- Approved admin, migration, or eDiscovery tooling
triage:
- Confirm whether the user expected device code authentication
- Review Graph activity volume and operation types after sign-in
- Determine whether the session accessed unusual mailboxes or performed search-heavy collection
- Check for follow-on inbox rule creation, OAuth abuse, exfiltration, or lateral phishing
validation:
- Test with a lab Graph mail workflow after device code authentication
lifecycle: production
owner: Detection Engineering
tags:
- attack.credential-access
- attack.collection
- attack.t1528
- attack.t1114
- graph
- device-code-phishing
- sentinel
- splunk
- converted-from-sentinel
production_tuning:
- Validate macro scope, time range, and field aliases in a non-production search head first.
- Tune known-good parent processes, service accounts, management hosts, and software deployment workflows.
- Where count thresholds exist, baseline by business unit or asset class before enabling notable actions.
