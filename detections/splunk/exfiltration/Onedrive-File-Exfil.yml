title: OneDrive File Upload Activity
id: SPLK-EXFIL-0008
source_id: SENT-EXFIL-0008
status: production
description: Detects OneDrive file upload activity that may support exfiltration when correlated with risky sign-ins, archive creation, or unusual endpoint behavior.
author: Adam Ring
date: '2026-03-26'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: m365
  category: onedrive_activity
source_table: CloudAppEvents
search: '`microsoft_defender_cloud_app_events`

  | where Application="OneDrive"

  | where like(lower(ActionType), "%fileuploaded%")

  | table Timestamp, AccountObjectId, AccountDisplayName, Application, ActionType, ObjectName, IPAddress, RawEventData'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: medium
risk_score: 55
tactics:
- Exfiltration
techniques:
- T1567.002
kill_chain_phases:
- Exfiltration
data_sources:
- CloudAppEvents
falsepositives:
- Normal user collaboration and synchronization
- Approved business uploads
triage:
- Determine whether the uploads are unusual for the user or host
- Review whether risky sign-ins, archive creation, or bulk file access occurred beforehand
- Check whether the destination context is expected
validation:
- Upload a benign file to a test OneDrive account and compare with normal user behavior
lifecycle: production
owner: Detection Engineering
tags:
- attack.exfiltration
- attack.t1567.002
- sentinel
- onedrive
- exfiltration
- splunk
- converted-from-sentinel
production_tuning:
- Validate macro scope, time range, and field aliases in a non-production search head first.
- Tune known-good parent processes, service accounts, management hosts, and software deployment workflows.
- Where count thresholds exist, baseline by business unit or asset class before enabling notable actions.
