title: PowerShell Email Exfiltration with Attachments
id: SPLK-EXFIL-0001
source_id: SENT-EXFIL-0001
status: production
description: Detects PowerShell commands that reference SMTP or mail libraries together with attachment-related arguments, which may indicate scripted email exfiltration.
author: Adam Ring
date: '2026-03-06'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: windows
  category: process_creation
source_table: DeviceProcessEvents
search: '`microsoft_defender_device_process_events`

  | where FileName IN ("powershell.exe", "pwsh.exe")

  | where like(lower(ProcessCommandLine), "%send-mailmessage%") OR like(lower(ProcessCommandLine), "%smtpclient%") OR like(lower(ProcessCommandLine), "%-attachments%") OR like(lower(ProcessCommandLine), "%smtp%")

  | table Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine, SHA1, ReportId'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: high
risk_score: 80
tactics:
- Exfiltration
techniques:
- T1020
- T1048
kill_chain_phases:
- Exfiltration
data_sources:
- DeviceProcessEvents
falsepositives:
- Approved scripted alerting or email notifications
- Legacy automation using Send-MailMessage
- Internal notification scripts with attachments
triage:
- Review recipients, attachment references, and script source
- Determine whether the script is approved and expected on the host
- Check for staging, archive creation, or document access before the email activity
- Inspect whether the same script also accessed browser stores, clipboard data, or sensitive files
validation:
- Run a benign test script using Send-MailMessage or SMTP in a lab
lifecycle: production
owner: Detection Engineering
tags:
- attack.exfiltration
- attack.t1020
- attack.t1048
- sentinel
- exfiltration
- splunk
- converted-from-sentinel
production_tuning:
- Validate macro scope, time range, and field aliases in a non-production search head first.
- Tune known-good parent processes, service accounts, management hosts, and software deployment workflows.
- Where count thresholds exist, baseline by business unit or asset class before enabling notable actions.
