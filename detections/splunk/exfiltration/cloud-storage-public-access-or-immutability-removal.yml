title: Cloud Storage Public Access or Immutability Removal
id: SPLK-EXFIL-0005
source_id: SENT-EXFIL-0005
status: testing
description: Detects cloud storage configuration changes that may enable exfiltration or destructive follow-on activity, including public access enablement, firewall weakening, or immutability removal.
author: Adam Ring
date: '2026-03-20'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: cloud
  category: administrative_activity
source_table: AzureActivity
search: '`azure_activity`

  | where OperationNameValue has_any ("Microsoft.Storage/storageAccounts/write","Microsoft.Storage/storageAccounts/blobServices/containers/write","Microsoft.Storage/storageAccounts/blobServices/write"

  | append [

  `manual_data_source_mapping_required`

  ]

  | append [

  `microsoft_defender_cloud_app_events`

  | where ActionType has_any ("SetBucketAcl","PutBucketAcl","PutBucketPolicy","UpdateStorageAccount","SetPublicAccess","RemoveImmutabilityPolicy","DeleteImmutabilityPolicy"

  ]

  | eval __translation_note="Residual KQL syntax remains. Manual review required."'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: high
risk_score: 86
tactics:
- Exfiltration
- Impact
techniques:
- T1567
- T1485
kill_chain_phases:
- Exfiltration
- Actions on Objectives
data_sources:
- AzureActivity
- CloudAppEvents
falsepositives:
- Approved storage administration changes
- Planned migrations or controlled public-sharing changes
- Authorized backup retention or legal hold modifications
triage:
- Manual validation is still required for this rule because the original KQL relied on complex joins, dynamic arrays, or source-specific cloud fields.
- Determine whether public access, firewall exceptions, or immutability settings were changed
- Validate whether the actor is an authorized cloud administrator
- Review whether AzCopy, cloud CLI tools, or unusual data access followed the change
- Check whether backup or recovery protections were weakened before destructive actions
validation:
- Modify public access or immutability settings on a lab storage account and confirm telemetry
lifecycle: testing
owner: Detection Engineering
tags:
- attack.exfiltration
- attack.impact
- attack.t1567
- attack.t1485
- cloud-storage
- immutability
- public-access
- sentinel
- splunk
- converted-from-sentinel
production_tuning:
- Validate macro scope, time range, and field aliases in a non-production search head first.
- Tune known-good parent processes, service accounts, management hosts, and software deployment workflows.
- Where count thresholds exist, baseline by business unit or asset class before enabling notable actions.
