title: AzCopy or Cloud CLI Bulk Export Activity
id: SPLK-EXFIL-0004
source_id: SENT-EXFIL-0004
status: production
description: Detects repeated use of cloud transfer CLIs such as AzCopy, AWS CLI, or gsutil for bulk export, sync, or transfer activity from endpoints.
author: Adam Ring
date: '2026-03-20'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: windows
  category: process_creation
source_table: DeviceProcessEvents
search: "`microsoft_defender_device_process_events`\n| where FileName IN (\"azcopy.exe\", \"azcopy\", \"aws.exe\", \"aws\", \"gsutil.exe\", \"gsutil\")\n| where like(lower(ProcessCommandLine), \"%copy %\") OR like(lower(ProcessCommandLine), \"%sync %\") OR like(lower(ProcessCommandLine), \"%cp %\") OR like(lower(ProcessCommandLine), \"%s3://%\") OR like(lower(ProcessCommandLine), \"%blob.core.windows.net%\") OR like(lower(ProcessCommandLine), \"%storage%\") OR like(lower(ProcessCommandLine), \"%gs://%\") OR like(lower(ProcessCommandLine), \"%download%\") OR like(lower(ProcessCommandLine), \"%upload%\")\n | stats count as ExecCount, values(ProcessCommandLine) as Commands, FirstSeen=min(Timestamp), LastSeen=max(Timestamp) by DeviceName, InitiatingProcessAccountName, FileName\n| where ExecCount >= 3"
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: high
risk_score: 80
tactics:
- Exfiltration
techniques:
- T1537
- T1567
kill_chain_phases:
- Exfiltration
data_sources:
- DeviceProcessEvents
falsepositives:
- Approved cloud migration or backup operations
- Engineering or DevOps workflows using cloud transfer tools
- Authorized bulk restore or synchronization tasks
triage:
- Determine whether the user or device is expected to use AzCopy, AWS CLI, or gsutil
- Review whether the command lines indicate bulk export, sync, or staging
- Correlate with storage permission changes, public access changes, or archive creation
- Check whether sensitive data or backups were likely involved
validation:
- Run a benign AzCopy, AWS CLI, or gsutil transfer in a lab and compare command-line patterns
lifecycle: production
owner: Detection Engineering
tags:
- attack.exfiltration
- attack.t1537
- attack.t1567
- azcopy
- aws-cli
- gsutil
- cloud-storage
- sentinel
- splunk
- converted-from-sentinel
production_tuning:
- Validate macro scope, time range, and field aliases in a non-production search head first.
- Tune known-good parent processes, service accounts, management hosts, and software deployment workflows.
- Where count thresholds exist, baseline by business unit or asset class before enabling notable actions.
