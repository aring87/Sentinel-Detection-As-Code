title: Cloud Backup or Storage Mass Delete Burst
id: SPLK-IMPACT-0004
source_id: SENT-IMPACT-0004
status: testing
description: Detects bursts of cloud storage or backup deletion activity that may indicate destructive cloud impact or anti-recovery actions.
author: Adam Ring
date: '2026-03-20'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: cloud
  service: administrative_activity
source_table: AzureActivity
search: '`azure_activity`

  | where OperationNameValue has_any ("Microsoft.Storage/storageAccounts/delete","Microsoft.RecoveryServices/vaults/delete","Microsoft.Compute/snapshots/delete"

  | append [

  | noop

  ]

  | append [

  `manual_data_source_mapping_required`

  ]

  | append [

  `manual_data_source_mapping_required`

  ]

  | append [

  `microsoft_defender_cloud_app_events`

  | where ActionType has_any ("DeleteBucket","DeleteObject","DeleteSnapshot","DeleteBackupVault","DeleteStorageAccount"

  ]

  | append [

  | noop

  ]

  | append [

  `manual_data_source_mapping_required`

  ]

  | append [

  `manual_data_source_mapping_required`

  ]

  | eval __translation_note="Residual KQL syntax remains. Manual review required."'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: high
risk_score: 90
tactics:
- Impact
techniques:
- T1485
- T1490
kill_chain_phases:
- Actions on Objectives
data_sources:
- AzureActivity
- CloudAppEvents
falsepositives:
- Planned decommissioning or cleanup work
- Approved lifecycle automation
- Authorized cloud retention or teardown workflows
triage:
- Manual validation is still required for this rule because the original KQL relied on complex joins, dynamic arrays, or source-specific cloud fields.
- Confirm whether storage accounts, snapshots, buckets, or backup vaults were deleted in bulk
- Validate whether the actor is expected to perform destructive cloud administration
- Review preceding public access changes, immutability removal, or credential abuse
- Check whether ransomware or extortion-related behavior is also present
validation:
- Test controlled snapshot, storage, or vault deletion activity in a cloud lab
lifecycle: testing
owner: Detection Engineering
tags:
- attack.impact
- attack.t1485
- attack.t1490
- cloud
- backup-destruction
- sentinel
- splunk
- converted-from-sentinel
production_tuning:
- Validate macro scope, time range, and field aliases in a non-production search head first.
- Tune known-good parent processes, service accounts, management hosts, and software deployment workflows.
- Where count thresholds exist, baseline by business unit or asset class before enabling notable actions.
