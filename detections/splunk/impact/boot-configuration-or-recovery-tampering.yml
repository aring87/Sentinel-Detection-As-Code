title: Boot Configuration or Recovery Tampering
id: SPLK-IMPACT-0003
source_id: SENT-IMPACT-0003
status: production
description: Detects attempts to disable recovery options or alter boot configuration, often used to hinder recovery during destructive attacks.
author: Adam Ring
date: '2026-03-06'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: windows
  category: process_creation
source_table: DeviceProcessEvents
search: '`microsoft_defender_device_process_events`

  | where FileName IN ("bcdedit.exe", "reagentc.exe")

  | where like(lower(ProcessCommandLine), "%recoveryenabled no%") OR like(lower(ProcessCommandLine), "%bootstatuspolicy ignoreallfailures%") OR like(lower(ProcessCommandLine), "%/disable%") OR like(lower(ProcessCommandLine), "%reagentc /disable%")

  | table Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine, SHA1, ReportId'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: high
risk_score: 78
tactics:
- Impact
- Defense Evasion
techniques:
- T1490
- T1562
kill_chain_phases:
- Impact
data_sources:
- DeviceProcessEvents
falsepositives:
- Rare approved maintenance or recovery workflows
- OS imaging or hardware repair activity
- Lab validation involving recovery configuration changes
triage:
- Review whether the system change was approved maintenance
- Check for ransomware staging, shadow copy deletion, or mass file modification nearby
- Inspect the initiating account, parent process, and execution path
- Determine whether the host is a workstation, server, or imaging system
validation:
- Run benign boot or recovery configuration changes in a lab and confirm telemetry
lifecycle: production
owner: Detection Engineering
