title: Security Tool Disable Attempt
id: SPLK-DEFEV-0002
source_id: SENT-DEFEV-0002
status: production
description: Detects attempts to stop security services or alter Windows Defender settings and exclusions.
author: Adam Ring
date: '2026-03-06'
modified: '2026-03-06'
platform: splunk
query_language: spl
logsource:
  product: windows
  category: process_creation
source_table: DeviceProcessEvents
search: '`microsoft_defender_device_process_events`

  | where FileName IN ("powershell.exe", "cmd.exe", "sc.exe", "net.exe", "reg.exe")

  | where like(lower(ProcessCommandLine), "%set-mppreference%") OR like(lower(ProcessCommandLine), "%disablerealtimemonitoring%") OR like(lower(ProcessCommandLine), "%add-mppreference%") OR like(lower(ProcessCommandLine), "% stop %") OR like(lower(ProcessCommandLine), "% config %") OR like(lower(ProcessCommandLine), "% windefend %") OR like(lower(ProcessCommandLine), "% sense %")

  | table Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: high
risk_score: 82
tactics:
- Defense Evasion
techniques:
- T1562.001
kill_chain_phases:
- Defense Evasion
data_sources:
- DeviceProcessEvents
falsepositives:
- Planned security maintenance
- Approved Defender policy changes by security administrators
triage:
- Identify the security control targeted and the user or process
- Review whether the activity aligns with maintenance windows
- Inspect for malware execution or staging after the change
validation:
- Run benign Defender configuration changes in a lab
lifecycle: production
owner: Detection Engineering
tags:
- attack.defense-evasion
- attack.t1562.001
- sentinel
- defense-evasion
- splunk
- converted-from-sentinel
production_tuning:
- Validate macro scope, time range, and field aliases in a non-production search head first.
- Tune known-good parent processes, service accounts, management hosts, and software deployment workflows.
- Where count thresholds exist, baseline by business unit or asset class before enabling notable actions.
