title: Disable Script Block Logging
id: SPLK-DE-0001
source_id: SENT-DE-0001
status: production
description: Detects registry modifications that disable PowerShell Script Block Logging.
author: Adam Ring
date: '2026-04-08'
modified: ''
platform: splunk
query_language: spl
logsource:
  product: windows
  category: registry_event
source_table: DeviceRegistryEvents
search: '`microsoft_defender_device_registry_events`

  | where like(lower(RegistryKey), "%scriptblocklogging%")

  | where RegistryValueData = "0"'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: medium
risk_score: 50
tactics:
- defense_evasion
techniques:
- t1562
kill_chain_phases: []
data_sources: []
falsepositives:
- Authorized administrative changes to PowerShell logging settings
triage:
- Confirm whether the registry change was approved by administrators
- Review the initiating user account, host, and process context
- Check for nearby PowerShell, LOLBin, or defense evasion activity on the same device
validation:
- Generate a test registry modification in a lab that disables Script Block Logging
- Confirm the query returns the expected DeviceRegistryEvents record
lifecycle: production
owner: detection-engineering
tags:
- attack.defense_evasion
- attack.t1562.002
- powershell
- logging
- splunk
- converted-from-sentinel
production_tuning:
- Validate macro scope, time range, and field aliases in a non-production search head first.
- Tune known-good parent processes, service accounts, management hosts, and software deployment workflows.
- Where count thresholds exist, baseline by business unit or asset class before enabling notable actions.
