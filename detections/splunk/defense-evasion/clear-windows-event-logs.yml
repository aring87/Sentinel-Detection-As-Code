title: Clear Windows Event Logs
id: SPLK-DEFEV-0003
source_id: SENT-DEFEV-0003
status: production
description: Detects commands used to clear Windows event logs in an effort to remove evidence.
author: Adam Ring
date: '2026-03-06'
modified: '2026-03-06'
platform: splunk
query_language: spl
logsource:
  product: windows
  category: process_creation
source_table: DeviceProcessEvents
search: '`microsoft_defender_device_process_events`

  | where FileName IN ("wevtutil.exe", "powershell.exe", "cmd.exe")

  | where like(lower(ProcessCommandLine), "% cl %") OR like(lower(ProcessCommandLine), "%clear-eventlog%") OR like(lower(ProcessCommandLine), "%remove-eventlog%")

  | table Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: high
risk_score: 75
tactics:
- Defense Evasion
techniques:
- T1070.001
kill_chain_phases:
- Defense Evasion
data_sources:
- DeviceProcessEvents
falsepositives:
- Rare admin log maintenance
- Lab validation or forensic cleanup exercises
triage:
- Review which logs were cleared and by whom
- Validate whether the actor is an approved administrator
- Check for suspicious activity immediately before the clear command
validation:
- Clear a noncritical lab event log and confirm the analytic triggers
lifecycle: production
owner: Detection Engineering
tags:
