title: Random AppData Roaming DLL Drop Followed by Scheduled Task
id: SPLK-PERS-0005
source_id: SENT-PERS-0005
status: production
description: Detects DLL creation in suspicious randomly named AppData\\Roaming folders followed by scheduled task creation, a pattern aligned to CleanUpLoader-style persistence chains.
author: Adam Ring
date: '2026-03-20'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: windows
  category: file_and_process
source_table: DeviceFileEvents
search: "`microsoft_defender_device_file_events`\n| where ActionType IN (\"FileCreated\",\"FileModified\")\n| where match(FolderPath, \"\\\\Users\\\\[^\\\\]+\\\\AppData\\\\Roaming\\\\[A-Za-z0-9]{10,16}[^\\\\]?\\\\\")\n| where like(lower(FileName), \"%.dll\")\n| rename Timestamp as DropTime\n| table DeviceId DeviceName DropTime FolderPath FileName InitiatingProcessAccountName InitiatingProcessFileName InitiatingProcessCommandLine\n| join type=inner DeviceId [\n    `microsoft_defender_device_process_events`\n    | where FileName=\"schtasks.exe\"\n    | where like(lower(ProcessCommandLine), \"%/create%\")\n    | rename Timestamp as TaskTime ProcessCommandLine as TaskCmd FileName as TaskProc\n    | table DeviceId TaskTime TaskCmd TaskProc InitiatingProcessAccountName\n]\n| eval __window_end=relative_time(DropTime, \"+30m\")\n| where TaskTime>=DropTime AND TaskTime<=__window_end\n| fields - __window_end\n| table DeviceName DropTime FolderPath FileName InitiatingProcessAccountName InitiatingProcessFileName\
  \ InitiatingProcessCommandLine TaskTime TaskProc TaskCmd"
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: high
risk_score: 84
tactics:
- Persistence
techniques:
- T1053.005
- T1547
kill_chain_phases:
- Persistence
data_sources:
- DeviceFileEvents
- DeviceProcessEvents
falsepositives:
- Rare software installers writing DLLs to user-profile subfolders before task creation
- Edge-case roaming-profile software deployments
triage:
- Review the dropped DLL path and whether the folder name appears random
- Determine which executable created the DLL and whether it masqueraded as a known utility
- Review the scheduled task created shortly afterward
- Check for outbound connections or loader behavior after persistence was established
validation:
- Simulate a benign DLL drop and scheduled task workflow in a lab for tuning
lifecycle: production
owner: Detection Engineering
tags:
- attack.persistence
- attack.t1053.005
- attack.t1547
- cleanup-loader
- appdata
- sentinel
- splunk
- converted-from-sentinel
production_tuning:
- Validate macro scope, time range, and field aliases in a non-production search head first.
- Tune known-good parent processes, service accounts, management hosts, and software deployment workflows.
- Where count thresholds exist, baseline by business unit or asset class before enabling notable actions.
