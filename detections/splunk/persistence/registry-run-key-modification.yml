title: Registry Run Key Modification
id: SPLK-PERS-0001
source_id: SENT-PERS-0001
status: production
description: Detects creation or modification of common autorun registry keys used for persistence.
author: Adam Ring
date: '2026-03-06'
modified: '2026-03-06'
platform: splunk
query_language: spl
logsource:
  product: windows
  category: registry_event
source_table: DeviceRegistryEvents
search: '`microsoft_defender_device_registry_events`

  | eval key_l=lower(RegistryKey), data_l=lower(RegistryValueData)

  | where ActionType IN ("RegistryValueSet","RegistryKeyCreated")

  | where like(key_l, "%\software\microsoft\windows\currentversion\run%") OR like(key_l, "%\software\microsoft\windows\currentversion\runonce%")

  | table Timestamp DeviceName InitiatingProcessAccountName InitiatingProcessFileName InitiatingProcessCommandLine RegistryKey RegistryValueName RegistryValueData ReportId'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: high
risk_score: 70
tactics:
- Persistence
techniques:
- T1547.001
kill_chain_phases:
- Persistence
data_sources:
- DeviceRegistryEvents
falsepositives:
- Legitimate software installers or updaters
- Authorized enterprise startup configuration changes
triage:
- Manual validation is still required for this rule because the original KQL relied on complex joins, dynamic arrays, or source-specific cloud fields.
- Review the written value and executable path
- Determine whether the initiating process is expected
- Check for associated file writes or scheduled task creation
validation:
- Set a benign Run key in a lab and confirm the event triggers
lifecycle: production
owner: Detection Engineering
