title: Suspicious Entra ID Control-Plane Changes by Nonstandard Actor
id: SPLK-PERS-0008
source_id: SENT-PERS-0008
status: testing
description: Detects risky Entra ID and hybrid identity control-plane changes, including conditional access modifications, authentication method changes, and app credential updates by unusual actors.
author: Adam Ring
date: '2026-03-25'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: azure
  service: auditlogs
source_table: AuditLogs
search: '`azure_auditlogs`

  | where OperationName has_any (

  | eval Actor=coalesce(InitiatedBy.user.userPrincipalName, InitiatedBy.app.displayName)

  | eval Target=TargetResources[0].displayName

  | table TimeGenerated, OperationName, ActivityDisplayName, Actor, Target, Result, ResultReason, Category, LoggedByService, AdditionalDetails

  | eval __translation_note="Residual KQL syntax remains. Manual review required."'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: high
risk_score: 90
tactics:
- Persistence
- Privilege Escalation
- Defense Evasion
techniques:
- T1098
- T1556
kill_chain_phases:
- Persistence
data_sources:
- AuditLogs
falsepositives:
- Legitimate IAM administration
- Planned conditional access or application changes
- Approved identity onboarding or certificate rotation
triage:
- Manual validation is still required for this rule because the original KQL relied on complex joins, dynamic arrays, or source-specific cloud fields.
- Review the exact Entra object changed and whether the actor normally performs this action
- Determine whether the change weakened security controls, added credentials, or created persistence
- Correlate with risky sign-ins, mailbox changes, OAuth consent, or device registration
- Validate CAB or change-ticket context for the operation
validation:
- Test benign conditional access, MFA, and application credential changes in a lab tenant
lifecycle: testing
owner: Detection Engineering
tags:
- attack.persistence
- attack.privilege-escalation
- attack.defense-evasion
- attack.t1098
- attack.t1556
- entra
- sentinel
- splunk
- converted-from-sentinel
production_tuning:
- Validate macro scope, time range, and field aliases in a non-production search head first.
- Tune known-good parent processes, service accounts, management hosts, and software deployment workflows.
- Where count thresholds exist, baseline by business unit or asset class before enabling notable actions.
