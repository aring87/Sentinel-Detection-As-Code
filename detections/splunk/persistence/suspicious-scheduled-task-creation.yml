title: Suspicious Scheduled Task Creation
id: SPLK-PERS-0002
source_id: SENT-PERS-0002
status: production
description: Detects scheduled task creation via schtasks or Task Scheduler PowerShell that may establish persistence.
author: Adam Ring
date: '2026-03-06'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: windows
  category: process_creation
source_table: DeviceProcessEvents
search: '`microsoft_defender_device_process_events`

  | where FileName IN ("schtasks.exe", "powershell.exe", "pwsh.exe")

  | where like(lower(ProcessCommandLine), "%/create%") OR like(lower(ProcessCommandLine), "%register-scheduledtask%") OR like(lower(ProcessCommandLine), "%new-scheduledtask%")

  | table Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine, SHA1, ReportId'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: high
risk_score: 72
tactics:
- Persistence
techniques:
- T1053.005
kill_chain_phases:
- Persistence
data_sources:
- DeviceProcessEvents
falsepositives:
- Legitimate enterprise task deployment
- Admin automation and maintenance jobs
- Software installation or updater tasks
triage:
- Review the task name, trigger, action, and creator
- Determine whether the creator is expected to manage tasks on this host
- Look for follow-on persistence, lateral movement, or suspicious payload execution
- Check whether the task launches scripts, LOLBins, or binaries from writable paths
validation:
- Create a benign scheduled task via schtasks and PowerShell in a lab
lifecycle: production
owner: Detection Engineering
tags:
- attack.persistence
- attack.t1053.005
- scheduled-task
- sentinel
- persistence
- splunk
- converted-from-sentinel
production_tuning:
- Validate macro scope, time range, and field aliases in a non-production search head first.
- Tune known-good parent processes, service accounts, management hosts, and software deployment workflows.
- Where count thresholds exist, baseline by business unit or asset class before enabling notable actions.
