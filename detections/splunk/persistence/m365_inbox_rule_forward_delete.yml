title: Suspicious Microsoft 365 Inbox Rule for Forwarding or Deletion
id: SPLK-PERS-0009
source_id: SENT-PERS-0009
status: production
description: Detects creation or modification of inbox rules that forward, redirect, delete, or hide emails in Microsoft 365, including rules that may suppress security notifications.
author: Adam Ring
date: '2026-03-25'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: m365
  service: unified_audit_log
source_table: OfficeActivity
search: '`m365_office_activity`

  | where Operation IN ("New-InboxRule", "Set-InboxRule")

  | eval Params=Parameters

  | where like(lower(Params), "%forwardto%") OR like(lower(Params), "%redirectto%") OR like(lower(Params), "%deletemessage%") OR like(lower(Params), "%movetofolder%") OR like(lower(Params), "%markasread%") OR like(lower(Params), "%stopprocessingrules%")

  | table TimeGenerated, UserId, Operation, OfficeWorkload, ClientIP, Parameters, ResultStatus'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: high
risk_score: 88
tactics:
- Persistence
- Collection
- Defense Evasion
techniques:
- T1114.003
- T1564
kill_chain_phases:
- Persistence
- Collection
data_sources:
- OfficeActivity
falsepositives:
- User-created mailbox organization rules
- Admin-created support or workflow rules
- Approved assistant or routing automations
triage:
- Review the rule action, targeted messages, and any external forwarding destinations
- Determine whether the mailbox owner created or approved the rule
- Check for suspicious sign-ins, OAuth abuse, delegation changes, or mail-access spikes
- Identify whether security or finance-related emails were hidden, deleted, or redirected
validation:
- Create a benign inbox rule in a test mailbox and validate audit coverage
lifecycle: production
owner: Detection Engineering
tags:
- attack.persistence
- attack.collection
- attack.defense-evasion
- attack.t1114.003
- attack.t1564
- m365
- inbox-rule
- sentinel
- splunk
- converted-from-sentinel
production_tuning:
- Validate macro scope, time range, and field aliases in a non-production search head first.
- Tune known-good parent processes, service accounts, management hosts, and software deployment workflows.
- Where count thresholds exist, baseline by business unit or asset class before enabling notable actions.
