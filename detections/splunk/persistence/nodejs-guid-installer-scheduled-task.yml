title: Node.js Installer or GUID-Named App Followed by Scheduled Task Persistence
id: SPLK-PERS-0006
source_id: SENT-PERS-0006
status: production
description: Detects suspicious installer or Node.js/Electron-style application execution followed by scheduled task persistence, intended to surface freeware-masquerading or SEO-poisoned software behavior.
author: Adam Ring
date: '2026-03-20'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: windows
  category: process_creation
source_table: DeviceProcessEvents
search: "`microsoft_defender_device_process_events`\n| eval file_l=lower(FileName), cmd_l=lower(ProcessCommandLine)\n| where file_l IN (\"node.exe\",\"msiexec.exe\",\"setup.exe\",\"install.exe\")\n| rename Timestamp as InstallTime ProcessCommandLine as InstallCmd\n| table DeviceId DeviceName InstallTime InstallCmd InitiatingProcessAccountName InitiatingProcessFileName InitiatingProcessCommandLine\n| join type=inner DeviceId [\n    `microsoft_defender_device_process_events`\n    | eval file_l=lower(FileName), cmd_l=lower(ProcessCommandLine)\n    | where file_l IN (\"schtasks.exe\",\"powershell.exe\")\n    | where like(cmd_l, \"%/create%\") OR like(cmd_l, \"%register-scheduledtask%\") OR like(cmd_l, \"%new-scheduledtask%\")\n    | rename Timestamp as PersistTime ProcessCommandLine as PersistCmd FileName as PersistProc\n    | table DeviceId PersistTime PersistCmd PersistProc\n]\n| eval __window_end=relative_time(InstallTime, \"+60m\")\n| where PersistTime>=InstallTime AND PersistTime<=__window_end\n\
  | fields - __window_end file_l cmd_l\n| table DeviceName InitiatingProcessAccountName InstallTime InstallCmd InitiatingProcessFileName InitiatingProcessCommandLine PersistTime PersistProc PersistCmd"
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: medium
risk_score: 70
tactics:
- Persistence
- Execution
techniques:
- T1053.005
- T1204
kill_chain_phases:
- Persistence
- Execution
data_sources:
- DeviceProcessEvents
falsepositives:
- Legitimate installers that register scheduled tasks
- Approved Electron or Node.js application setups
- Enterprise software deployment
triage:
- Validate the software package name, signer, source URL, and installation path
- Determine whether the app is approved or masquerading as freeware or utility software
- Review the created scheduled task, payload path, and execution frequency
- Check whether the software was downloaded from suspicious SEO-poisoned or typosquatted sites
validation:
- Test with a benign installer that creates a scheduled task and tune for approved software
lifecycle: production
owner: Detection Engineering
tags:
- attack.persistence
- attack.execution
- attack.t1053.005
- attack.t1204
- installer
- nodejs
- scheduled-task
- sentinel
- splunk
- converted-from-sentinel
production_tuning:
- Validate macro scope, time range, and field aliases in a non-production search head first.
- Tune known-good parent processes, service accounts, management hosts, and software deployment workflows.
- Where count thresholds exist, baseline by business unit or asset class before enabling notable actions.
