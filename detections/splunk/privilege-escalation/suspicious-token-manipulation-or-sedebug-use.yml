title: Suspicious Token Manipulation or SeDebug Use
id: SPLK-PRIVESC-0002
source_id: SENT-PRIVESC-0002
status: production
description: Detects tools or command-line artifacts commonly associated with token theft, impersonation, or elevation attempts on endpoints.
author: Adam Ring
date: '2026-03-06'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: windows
  category: process_creation
source_table: DeviceProcessEvents
search: '`microsoft_defender_device_process_events`

  | eval cmd_l=lower(ProcessCommandLine), file_l=lower(FileName)

  | where file_l IN ("powershell.exe","pwsh.exe","cmd.exe","rundll32.exe","reg.exe","whoami.exe","procdump.exe")

  | where like(cmd_l, "%sedebugprivilege%") OR like(cmd_l, "%adjusttokenprivileges%") OR like(cmd_l, "%duplicatetokenex%") OR like(cmd_l, "%impersonate%") OR like(cmd_l, "%token%")

  | table Timestamp DeviceName AccountName FileName ProcessCommandLine InitiatingProcessFileName InitiatingProcessCommandLine SHA1 ReportId'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: high
risk_score: 78
tactics:
- Privilege Escalation
techniques:
- T1134
- T1068
kill_chain_phases:
- Privilege Escalation
data_sources:
- DeviceProcessEvents
falsepositives:
- Approved red-team or lab activity
- Security tool strings in research environments
- Internal training or controlled exploit development environments
triage:
- Manual validation is still required for this rule because the original KQL relied on complex joins, dynamic arrays, or source-specific cloud fields.
- Identify the tool or script containing the token-manipulation indicators
- Review process ancestry, signer, path, and whether the host is a security-testing asset
- Check for LSASS access, SeDebug abuse, service creation, or UAC bypass nearby
- Determine whether elevated child processes or integrity-level changes followed
validation:
- Replay representative telemetry or generate controlled token-manipulation tool activity in a lab
lifecycle: production
owner: Detection Engineering
tags:
- attack.privilege-escalation
- attack.t1134
- attack.t1068
- sentinel
- privilege-escalation
- splunk
- converted-from-sentinel
production_tuning:
- Validate macro scope, time range, and field aliases in a non-production search head first.
- Tune known-good parent processes, service accounts, management hosts, and software deployment workflows.
- Where count thresholds exist, baseline by business unit or asset class before enabling notable actions.
