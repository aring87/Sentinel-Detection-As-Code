title: Event Viewer UAC Bypass Registry Hijack
id: SPLK-PRIVESC-0001
source_id: SENT-PRIVESC-0001
status: production
description: Detects registry hijack patterns associated with the Event Viewer UAC bypass technique.
author: Adam Ring
date: '2026-03-06'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: windows
  category: registry_event
source_table: DeviceRegistryEvents
search: '`microsoft_defender_device_registry_events`

  | eval key_l=lower(RegistryKey)

  | where ActionType IN ("RegistryValueSet","RegistryKeyCreated")

  | where like(key_l, "%\software\classes\mscfile\shell\open\command%")

  | table Timestamp DeviceName InitiatingProcessAccountName InitiatingProcessFileName InitiatingProcessCommandLine RegistryKey RegistryValueName RegistryValueData ReportId'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: high
risk_score: 80
tactics:
- Privilege Escalation
- Defense Evasion
techniques:
- T1548.002
kill_chain_phases:
- Privilege Escalation
data_sources:
- DeviceRegistryEvents
falsepositives:
- Rare troubleshooting or software repair actions
- Authorized UAC research in a lab
triage:
- Manual validation is still required for this rule because the original KQL relied on complex joins, dynamic arrays, or source-specific cloud fields.
- Review the value written under the hijacked key and whether it points to cmd, PowerShell, mshta, or another interpreter
- Determine whether the write was user initiated, scripted, or dropped by another process
- Check for subsequent eventvwr.exe, mmc.exe, or elevated child-process launches
- Correlate with other UAC bypass or registry-hijack activity on the same host
validation:
- Write the registry key in a lab and confirm telemetry coverage
lifecycle: production
