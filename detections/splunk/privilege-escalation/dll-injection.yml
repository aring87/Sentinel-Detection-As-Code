title: Potential DLL Injection Tooling or Command Artifacts
id: SPLK-PRIVESC-0004
source_id: SENT-PRIVESC-0004
status: production
description: Detects command-line artifacts and tool names commonly associated with DLL injection, remote thread creation, or process-memory manipulation.
author: Adam Ring
date: '2026-03-26'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: windows
  category: process_creation
source_table: DeviceProcessEvents
search: '`microsoft_defender_device_process_events`

  | eval cmd_l=lower(ProcessCommandLine), file_l=lower(FileName)

  | where file_l IN ("rundll32.exe","regsvr32.exe","powershell.exe","pwsh.exe")

  | where like(cmd_l, "%virtualallocex%") OR like(cmd_l, "%writeprocessmemory%") OR like(cmd_l, "%createremotethread%") OR like(cmd_l, "%queueuserapc%") OR like(cmd_l, "%loadlibrary%") OR like(cmd_l, "%reflective%")

  | table Timestamp DeviceName AccountName FileName ProcessCommandLine InitiatingProcessFileName InitiatingProcessCommandLine SHA1 ReportId'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: high
risk_score: 72
tactics:
- Privilege Escalation
- Defense Evasion
techniques:
- T1055.001
kill_chain_phases:
- Privilege Escalation
data_sources:
- DeviceProcessEvents
falsepositives:
- Approved red-team or malware-analysis tooling
- Security research in controlled lab environments
- Developer test harnesses that reference injection APIs in arguments
triage:
- Manual validation is still required for this rule because the original KQL relied on complex joins, dynamic arrays, or source-specific cloud fields.
- Determine whether the process is a known security tool, injector, or packer
- Review parent process, execution path, and whether the binary is signed or approved
- Correlate with LSASS access, token abuse, service abuse, or suspicious child processes
- Check for nearby file drops, persistence changes, or outbound network activity
validation:
- Execute a benign injection-lab tool or replay representative telemetry in a controlled environment
lifecycle: production
owner: Detection Engineering
tags:
- attack.privilege-escalation
- attack.defense-evasion
- attack.t1055.001
- sentinel
- privilege-escalation
- splunk
- converted-from-sentinel
production_tuning:
- Validate macro scope, time range, and field aliases in a non-production search head first.
- Tune known-good parent processes, service accounts, management hosts, and software deployment workflows.
- Where count thresholds exist, baseline by business unit or asset class before enabling notable actions.
