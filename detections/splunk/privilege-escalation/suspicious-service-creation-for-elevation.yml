title: Suspicious Service Creation for Elevation
id: SPLK-PRIVESC-0003
source_id: SENT-PRIVESC-0003
status: production
description: Detects service creation or service configuration commands that may be used to execute code with SYSTEM privileges.
author: Adam Ring
date: '2026-03-06'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: windows
  category: process_creation
source_table: DeviceProcessEvents
search: '`microsoft_defender_device_process_events`

  | where FileName IN ("sc.exe", "cmd.exe", "powershell.exe", "pwsh.exe")

  | where like(lower(ProcessCommandLine), "% create %") OR like(lower(ProcessCommandLine), "%new-service%") OR like(lower(ProcessCommandLine), "%binpath=%") OR like(lower(ProcessCommandLine), "%set-service%")

  | table Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine, SHA1, ReportId'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: high
risk_score: 74
tactics:
- Privilege Escalation
- Persistence
techniques:
- T1543.003
kill_chain_phases:
- Privilege Escalation
data_sources:
- DeviceProcessEvents
falsepositives:
- Legitimate service deployments by administrators
- Approved software installation workflows
- Endpoint management or software packaging tools
triage:
- Review the service name, binary path, and whether the path is user-writable or newly created
- Determine whether the user should be creating or modifying services on the device
- Correlate with file creation, service start events, and any suspicious parent process
- Check whether the service points to LOLBins, scripts, or unsigned binaries
validation:
- Create a benign lab service and validate the command is captured
lifecycle: production
owner: Detection Engineering
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1543.003
- sentinel
- privilege-escalation
- splunk
- converted-from-sentinel
production_tuning:
- Validate macro scope, time range, and field aliases in a non-production search head first.
- Tune known-good parent processes, service accounts, management hosts, and software deployment workflows.
- Where count thresholds exist, baseline by business unit or asset class before enabling notable actions.
