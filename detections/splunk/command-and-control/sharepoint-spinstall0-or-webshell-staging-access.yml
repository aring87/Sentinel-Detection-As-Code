title: SharePoint SPInstall0 or Suspicious Setup Artifact Access
id: SPLK-C2-0005
source_id: SENT-C2-0005
status: production
description: Detects suspicious access to SharePoint setup or staging artifact names such as SPInstall0 that may indicate web-shell staging, malicious package deployment, or compromise of SharePoint-related infrastructure.
author: Adam Ring
date: '2026-03-20'
modified: '2026-03-20'
platform: splunk
query_language: spl
logsource:
  product: cloud
  service: file_activity
source_table: OfficeActivity
search: '`m365_office_activity`

  | where like(lower(Operation), "%fileaccessed%") OR like(lower(Operation), "%filedownloaded%") OR like(lower(Operation), "%filemodified%") OR like(lower(Operation), "%fileuploaded%")

  | where like(lower(OfficeObjectId), "%spinstall0%") OR like(lower(OfficeObjectId), "%spinstall0%") OR like(lower(OfficeObjectId), "%setup.aspx%") OR like(lower(OfficeObjectId), "%install.aspx%") OR like(lower(OfficeObjectId), "%web.config%") OR like(lower(OfficeObjectId), "%layouts%")

  | table TimeGenerated, UserId, Operation, OfficeObjectId, SourceRelativeUrl, Site_Url, ClientIP'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: high
risk_score: 79
tactics:
- Command and Control
- Persistence
techniques:
- T1505.003
- T1105
kill_chain_phases:
- Command and Control
- Persistence
data_sources:
- OfficeActivity
falsepositives:
- Legitimate SharePoint administration or upgrade activity
triage:
- Validate whether the activity is tied to approved SharePoint administration
- Review the accessed object names and whether they indicate setup, install, or web-shell staging artifacts
- Check for subsequent command execution, suspicious uploads, or remote management activity
- Correlate with admin sign-ins, privilege changes, or suspicious app registration activity
validation:
- Test in a lab SharePoint environment with benign setup-related file access patterns
lifecycle: production
owner: Detection Engineering
tags:
- attack.command-and-control
- attack.persistence
- attack.t1505.003
- attack.t1105
- sharepoint
- spinstall0
- webshell
- sentinel
- splunk
- converted-from-sentinel
production_tuning:
- Validate macro scope, time range, and field aliases in a non-production search head first.
- Tune known-good parent processes, service accounts, management hosts, and software deployment workflows.
- Where count thresholds exist, baseline by business unit or asset class before enabling notable actions.
