title: Suspicious Web Download via Certutil or Bitsadmin
id: SPLK-C2-0003
source_id: SENT-C2-0003
status: production
description: Detects built-in Windows utilities downloading remote content, a common pattern for staging payloads, tooling, or command-and-control infrastructure.
author: Adam Ring
date: '2026-03-06'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: windows
  category: process_creation
source_table: DeviceProcessEvents
search: '`microsoft_defender_device_process_events`

  | where FileName IN ("certutil.exe", "bitsadmin.exe")

  | where like(lower(ProcessCommandLine), "%http://%") OR like(lower(ProcessCommandLine), "%https://%") OR like(lower(ProcessCommandLine), "%/transfer%") OR like(lower(ProcessCommandLine), "%/addfile%") OR like(lower(ProcessCommandLine), "%-urlcache%") OR like(lower(ProcessCommandLine), "%download%")

  | table Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine, InitiatingProcessFileName, InitiatingProcessCommandLine, SHA1, ReportId'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: high
risk_score: 75
tactics:
- Command and Control
- Execution
techniques:
- T1105
kill_chain_phases:
- Command and Control
data_sources:
- DeviceProcessEvents
falsepositives:
- Approved software distribution or update tasks
- Administrator troubleshooting downloads
- Legacy scripts using built-in transfer utilities
triage:
- Review the remote URL, destination path, and whether the file was later executed
- Determine whether the command is part of approved admin workflow
- Check for execution from temp, downloads, ProgramData, or other user-writable locations
validation:
- Use certutil or bitsadmin to download a benign file in a lab and compare with known admin behavior
lifecycle: production
owner: Detection Engineering
tags:
- attack.command-and-control
- attack.execution
- sentinel
- certutil
- bitsadmin
- command-and-control
- splunk
- converted-from-sentinel
production_tuning:
- Validate macro scope, time range, and field aliases in a non-production search head first.
- Tune known-good parent processes, service accounts, management hosts, and software deployment workflows.
- Where count thresholds exist, baseline by business unit or asset class before enabling notable actions.
