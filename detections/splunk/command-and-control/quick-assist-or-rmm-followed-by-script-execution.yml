title: Quick Assist or RMM Followed by Script Execution
id: SPLK-C2-0004
source_id: SENT-C2-0004
status: production
description: Detects Quick Assist or common RMM tool execution followed by suspicious scripting activity, a pattern often seen in social-engineering-driven intrusions and hands-on-keyboard operations.
author: Adam Ring
date: '2026-03-20'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: windows
  service: process_creation
source_table: DeviceProcessEvents
search: "`microsoft_defender_device_process_events`\n| eval file_l=lower(FileName), cmd_l=lower(ProcessCommandLine)\n| where file_l IN (\"quickassist.exe\",\"quickassistlauncher.exe\",\"teamviewer.exe\",\"teamviewer_service.exe\",\"screenconnect.clientservice.exe\",\"screenconnect.windowsclient.exe\",\"anydesk.exe\",\"logmein.exe\",\"bomgar-scc.exe\",\"bomgar-rdp.exe\",\"splashtop-streamer.exe\",\"ninjarmmagent.exe\",\"ateraagent.exe\")\n| rename Timestamp as RMMTime AccountName as RMMUser FileName as RMMProcess ProcessCommandLine as RMMCmd\n| table DeviceId DeviceName RMMTime RMMUser RMMProcess RMMCmd\n| join type=inner DeviceId [\n    `microsoft_defender_device_process_events`\n    | eval file_l=lower(FileName), cmd_l=lower(ProcessCommandLine)\n    | where file_l IN (\"powershell.exe\",\"pwsh.exe\",\"cmd.exe\",\"wscript.exe\",\"cscript.exe\",\"mshta.exe\",\"rundll32.exe\")\n    | where like(cmd_l, \"%-enc%\") OR like(cmd_l, \"%downloadstring%\") OR like(cmd_l, \"%curl %\") OR like(cmd_l,\
  \ \"%iwr %\") OR like(cmd_l, \"%irm %\") OR like(cmd_l, \"%iex %\") OR like(cmd_l, \"%frombase64string%\") OR like(cmd_l, \"%http://%\") OR like(cmd_l, \"%https://%\") OR like(cmd_l, \"%.bat%\") OR like(cmd_l, \"%.cmd%\")\n    | rename Timestamp as ScriptTime AccountName as ScriptUser FileName as ScriptProcess ProcessCommandLine as ScriptCmd\n    | table DeviceId ScriptTime ScriptUser ScriptProcess ScriptCmd\n]\n| eval __window_end=relative_time(RMMTime, \"+30m\")\n| where ScriptTime>=RMMTime AND ScriptTime<=__window_end\n| fields - __window_end file_l cmd_l\n| table DeviceName RMMTime RMMUser RMMProcess RMMCmd ScriptTime ScriptUser ScriptProcess ScriptCmd"
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: high
risk_score: 82
tactics:
- Command and Control
- Execution
techniques:
- T1219
- T1059
kill_chain_phases:
- Command and Control
- Execution
data_sources:
- DeviceProcessEvents
falsepositives:
- Approved remote support sessions
- Helpdesk or infrastructure administration using sanctioned RMM tools
- IT automation launched during legitimate support workflows
triage:
- Confirm whether the RMM tool is approved in your environment
- Review the parent-child chain and whether scripting began shortly after remote session establishment
- Validate whether the affected user requested support or was targeted by a social-engineering lure
- Check for persistence, credential theft, exfiltration, or additional tooling after the remote session
validation:
- Simulate a sanctioned Quick Assist or RMM session and compare with suspicious script-launch behavior
lifecycle: production
owner: Detection Engineering
tags:
- attack.command-and-control
- attack.execution
- attack.t1219
- attack.t1059
- rmm
- quickassist
- sentinel
- splunk
- converted-from-sentinel
production_tuning:
- Validate macro scope, time range, and field aliases in a non-production search head first.
- Tune known-good parent processes, service accounts, management hosts, and software deployment workflows.
- Where count thresholds exist, baseline by business unit or asset class before enabling notable actions.
