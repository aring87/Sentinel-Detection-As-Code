title: Potential Spearphishing Attachment Execution
id: SPLK-INIT-0003
source_id: SENT-INIT-0003
status: production
description: Detects Office applications spawning script interpreters or LOLBins shortly after opening files from user download, temp, or cache paths.
author: Adam Ring
date: '2026-03-06'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: windows
  category: process_creation
source_table: DeviceProcessEvents
search: '`microsoft_defender_device_process_events`

  | where InitiatingProcessFileName IN ("winword.exe", "excel.exe", "powerpnt.exe", "outlook.exe")

  | where FileName IN ("powershell.exe", "cmd.exe", "mshta.exe", "wscript.exe", "cscript.exe", "rundll32.exe")

  | where like(lower(InitiatingProcessFolderPath), "%downloads%") OR like(lower(InitiatingProcessFolderPath), "%appdata\\local\\temp%") OR like(lower(InitiatingProcessFolderPath), "%inetcache%")

  | table Timestamp, DeviceName, AccountName, InitiatingProcessFileName, InitiatingProcessFolderPath, FileName, ProcessCommandLine, InitiatingProcessCommandLine, SHA1, ReportId'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: high
risk_score: 80
tactics:
- Initial Access
- Execution
techniques:
- T1566.001
kill_chain_phases:
- Delivery
- Execution
data_sources:
- DeviceProcessEvents
falsepositives:
- Approved macro-enabled business workflows
- Internal automation launched through Office
- Security testing with malicious-document simulations
triage:
- Review the parent Office process, opened document path, and child process tree
- Check for downloads, external URLs, macro indicators, or script launch behavior
- Investigate the source email, attachment name, and sender context
- Determine whether additional persistence or credential access occurred afterward
validation:
- Open a benign macro-enabled test document in a lab and compare with normal Office behavior
lifecycle: production
owner: Detection Engineering
tags:
- attack.initial-access
- attack.execution
- attack.t1566.001
- sentinel
- initial-access
- splunk
- converted-from-sentinel
production_tuning:
- Validate macro scope, time range, and field aliases in a non-production search head first.
- Tune known-good parent processes, service accounts, management hosts, and software deployment workflows.
- Where count thresholds exist, baseline by business unit or asset class before enabling notable actions.
