title: Device Code Sign-In Followed by Device Registration
id: SPLK-INIT-0004
source_id: SENT-INIT-0004
status: production
description: Detects successful device code authentication followed closely by new device registration activity for the same user, which may indicate device code phishing followed by actor-controlled device enrollment.
author: Adam Ring
date: '2026-03-20'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: entra_id
  service: sign_in_and_cloud_app
source_table: SigninLogs
search: '`azure_signinlogs`

  | where AuthenticationProtocol = "deviceCode"

  | where ResultType=0

  | eval JoinUser=lower(UserPrincipalName)

  | where isnotnull(JoinUser) AND JoinUser!=""

  | rename TimeGenerated as SigninTime

  | table SigninTime, JoinUser, IPAddress, AppDisplayName, CorrelationId

  | join type=inner JoinUser [

  `microsoft_defender_cloud_app_events`

  | where AccountDisplayName="Device Registration Service" OR Application = "Device Registration Service"

  | eval JoinUser=lower(RawEventData.ObjectId)

  | eval DeviceName=parse_json(RawEventData.ModifiedProperties)[1].NewValue

  | eval DeviceObjectId=parse_json(RawEventData.ModifiedProperties)[0].NewValue

  | where isnotnull(JoinUser) AND JoinUser!=""

  | rename TimeGenerated as RegistrationTime

  | table RegistrationTime, JoinUser, DeviceName, DeviceObjectId, Application, RawEventData

  ]

  | where (RegistrationTime>=SigninTime AND RegistrationTime<=relative_time(SigninTime, "+2h"))

  | table SigninTime, RegistrationTime, JoinUser, IPAddress, AppDisplayName, DeviceName, DeviceObjectId, Application, CorrelationId, RawEventData'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: high
risk_score: 90
tactics:
- Initial Access
- Credential Access
techniques:
- T1566
- T1528
kill_chain_phases:
- Delivery
- Exploitation
data_sources:
- SigninLogs
- CloudAppEvents
falsepositives:
- Legitimate device code enrollment scenarios
- Approved device registration workflows
- Lab validation of device registration flows
triage:
- Confirm whether the user expected a device code prompt
- Review the source IP, app, and any unusual proxy, ASN, or geography signals
- Validate whether the registered device is known, corporate-owned, and expected
- Check for follow-on mailbox, SharePoint, Teams, or Graph API access after registration
validation:
- Test with a lab device code sign-in and controlled device registration workflow
lifecycle: production
owner: Detection Engineering
