title: Multiple User Device Code Sign-Ins
id: SPLK-INIT-0001
source_id: SENT-INIT-0001
status: production
description: Detects device code authentication across multiple users from the same source context in a short time window, a pattern associated with phishing and token theft.
author: Adam Ring
date: '2026-03-06'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: azure
  category: authentication
source_table: SigninLogs
search: '`azure_signinlogs`

  | where AuthenticationProtocol = "deviceCode"

  | eval JoinUser=lower(UserPrincipalName)

  | bin TimeGenerated span=30m | stats dc(JoinUser) as UserCount, values(JoinUser) as Users, values(AppDisplayName) as Apps by IPAddress, AppDisplayName, TimeGenerated

  | where UserCount >= 3'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: high
risk_score: 75
tactics:
- Initial Access
- Credential Access
techniques:
- T1566
- T1078
kill_chain_phases:
- Delivery
data_sources:
- SigninLogs
falsepositives:
- Legitimate device code workflows in limited environments
- Test tenants, labs, or staged onboarding events
- Shared proxy or jump-box scenarios with known auth workflows
triage:
- Review the source IP, users, app, and time window involved
- Determine whether device code authentication is allowed or expected
- Correlate with mailbox access, app consent, token abuse, or device registration
- Check whether multiple users were targeted by similar lures
validation:
- Perform controlled device code sign-ins in a lab and tune thresholds against normal activity
lifecycle: production
owner: Detection Engineering
tags:
- attack.initial-access
- attack.credential-access
- attack.t1566
- attack.t1078
- sentinel
- initial-access
- splunk
- converted-from-sentinel
production_tuning:
- Validate macro scope, time range, and field aliases in a non-production search head first.
- Tune known-good parent processes, service accounts, management hosts, and software deployment workflows.
- Where count thresholds exist, baseline by business unit or asset class before enabling notable actions.
