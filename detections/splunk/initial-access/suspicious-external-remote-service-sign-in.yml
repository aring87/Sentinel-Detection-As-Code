title: Suspicious External Remote Service Sign-In
id: SPLK-INIT-0002
source_id: SENT-INIT-0002
status: production
description: Detects successful external sign-ins to remote access or administrative services that may represent abuse of external remote services.
author: Adam Ring
date: '2026-03-06'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: azure
  category: authentication
source_table: SigninLogs
search: '`azure_signinlogs`

  | where ResultType=0

  | where not(ipv4_is_private(IPAddress))

  | where like(lower(AppDisplayName), "%azure portal%") OR like(lower(AppDisplayName), "%windows sign in%") OR like(lower(AppDisplayName), "%vpn%") OR like(lower(AppDisplayName), "%remote desktop%")

  | table TimeGenerated, UserPrincipalName, IPAddress, AppDisplayName, Location, ConditionalAccessStatus, RiskLevelAggregated, UserAgent'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: high
risk_score: 70
tactics:
- Initial Access
techniques:
- T1133
kill_chain_phases:
- Initial Access
data_sources:
- SigninLogs
falsepositives:
- Authorized travel or remote administration
- Known VPN gateways or managed remote services
- Contractor or support access from approved locations
triage:
- Review location, device, and identity risk context
- Compare the sign-in to the user's normal baseline
- Correlate with endpoint remote access events, device registration, or mailbox access
- Determine whether the source IP maps to expected VPN, cloud, or remote support infrastructure
validation:
- Validate against known remote access scenarios and public-IP sign-in baselines in your environment
lifecycle: production
owner: Detection Engineering
tags:
- attack.initial-access
- attack.t1133
- sentinel
- initial-access
- splunk
- converted-from-sentinel
production_tuning:
- Validate macro scope, time range, and field aliases in a non-production search head first.
- Tune known-good parent processes, service accounts, management hosts, and software deployment workflows.
- Where count thresholds exist, baseline by business unit or asset class before enabling notable actions.
