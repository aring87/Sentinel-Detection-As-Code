title: OAuth Redirection Abuse URL Click
id: SPLK-INIT-0005
source_id: SENT-INIT-0005
status: production
description: Detects suspicious OAuth authorization links clicked by users where parameters suggest redirection abuse or attacker-controlled redirect handling.
author: Adam Ring
date: '2026-03-20'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: email_and_browser
  service: url_clicks
source_table: UrlClickEvents
search: '`microsoft_defender_url_click_events`

  | where ActionType in ("ClickAllowed","UrlScanInProgress","UrlErrorPage") OR IsClickedThrough!="0"

  | where like(lower(UrlChain), "%login.microsoftonline.com%") OR like(lower(UrlChain), "%oauth2%") OR like(lower(UrlChain), "%authorize%") OR like(lower(UrlChain), "%common/oauth2%")

  | where like(lower(UrlChain), "%prompt=none%") OR like(lower(UrlChain), "%response_type=code%") OR like(lower(UrlChain), "%redirect_uri=%")

  | where like(lower(UrlChain), "%invalid_scope%") OR like(lower(UrlChain), "%scope=%")

  | table Timestamp, AccountUpn, ActionType, Url, UrlChain, NetworkMessageId'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: high
risk_score: 82
tactics:
- Initial Access
techniques:
- T1566.002
kill_chain_phases:
- Delivery
data_sources:
- UrlClickEvents
falsepositives:
- Rare legitimate OAuth testing workflows
- Internal developer auth troubleshooting
- Authorized application integration testing
triage:
- Review the full URL chain and redirect target
- Determine whether the message used a collaboration, e-signature, or meeting lure
- Identify whether the clicked link redirected to an attacker-controlled domain or auto-download path
- Check for nearby device code, risky sign-in, consent abuse, or browser download activity for the same user
validation:
- Test with a benign OAuth authorize URL in a lab mailbox and tune on target parameters
lifecycle: production
owner: Detection Engineering
tags:
- attack.initial-access
- attack.t1566.002
- oauth
- redirection-abuse
- phishing
- sentinel
- splunk
- converted-from-sentinel
production_tuning:
- Validate macro scope, time range, and field aliases in a non-production search head first.
- Tune known-good parent processes, service accounts, management hosts, and software deployment workflows.
- Where count thresholds exist, baseline by business unit or asset class before enabling notable actions.
