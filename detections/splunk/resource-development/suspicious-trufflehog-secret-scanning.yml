title: Suspicious TruffleHog Secret Scanning
id: SPLK-RESDEV-0005
source_id: SENT-RESDEV-0005
status: production
description: Detects TruffleHog execution from unexpected hosts or users, aligned to secret-scanning and supply-chain intrusion tradecraft.
author: Adam Ring
date: '2026-03-20'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: windows
  service: process_creation
source_table: DeviceProcessEvents
search: '`microsoft_defender_device_process_events`

  | eval file_l=lower(FileName), cmd_l=lower(ProcessCommandLine)

  | where file_l IN ("trufflehog.exe","trufflehog")

  | where like(cmd_l, "%github%") OR like(cmd_l, "%gitlab%") OR like(cmd_l, "%filesystem%") OR like(cmd_l, "%s3%") OR like(cmd_l, "%--results=%") OR like(cmd_l, "%--json%")

  | table Timestamp DeviceName InitiatingProcessAccountName InitiatingProcessFileName FileName ProcessCommandLine'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: medium
risk_score: 68
tactics:
- Resource Development
- Credential Access
techniques:
- T1552
- T1580
kill_chain_phases:
- Resource Development
- Credential Access
data_sources:
- DeviceProcessEvents
falsepositives:
- Approved security engineering or DevSecOps secret scanning
- Internal developer security workflows
- CI/CD validation on sanctioned engineering hosts
triage:
- Manual validation is still required for this rule because the original KQL relied on complex joins, dynamic arrays, or source-specific cloud fields.
- Validate whether TruffleHog is authorized on the device and for the initiating user
- Review whether the command targeted repositories, cloud credentials, or secrets stores
- Check for nearby AWS, Azure, or GitHub API activity
- Investigate whether the execution was followed by credential use, cloud enumeration, or package publishing
validation:
- Test with a benign TruffleHog scan in a development or lab environment
lifecycle: production
owner: Detection Engineering
tags:
