title: SharePoint or SaaS Third-Party Integration Secret Access
id: SPLK-RESDEV-0006
source_id: SENT-RESDEV-0006
status: testing
description: Detects suspicious access or modification activity involving third-party integration credentials or application secrets in cloud and SaaS environments.
author: Adam Ring
date: '2026-03-20'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: cloud
  service: audit
source_table: AuditLogs
search: '`azure_auditlogs`

  | where OperationName has_any ("Update application","Add service principal","Add password credential","Add key credential"

  | append [

  `m365_office_activity`

  | where Operation has_any ("FileAccessed","FileDownloaded","FileModified"

  ]

  | append [

  `manual_data_source_mapping_required`

  ]

  | eval __translation_note="Residual KQL syntax remains. Manual review required."'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: high
risk_score: 76
tactics:
- Resource Development
- Credential Access
techniques:
- T1552
- T1580
kill_chain_phases:
- Resource Development
- Credential Access
data_sources:
- AuditLogs
- OfficeActivity
falsepositives:
- Approved integration maintenance
- Legitimate application secret rotation
- Normal SharePoint admin or developer configuration work
triage:
- Manual validation is still required for this rule because the original KQL relied on complex joins, dynamic arrays, or source-specific cloud fields.
- Determine whether third-party integration credentials, config files, or application secrets were accessed or changed
- Validate whether the actor is expected to maintain integrations
- Review subsequent API use, consent changes, file exports, or cloud sign-ins tied to the same user or app
- Check whether the activity overlaps with suspicious app registration or OAuth consent events
validation:
- Test with a controlled secret rotation and integration update workflow
lifecycle: testing
owner: Detection Engineering
tags:
- attack.resource-development
- attack.credential-access
- attack.t1552
- attack.t1580
- sharepoint
- integration-secrets
- supply-chain
- sentinel
- splunk
- converted-from-sentinel
production_tuning:
- Validate macro scope, time range, and field aliases in a non-production search head first.
- Tune known-good parent processes, service accounts, management hosts, and software deployment workflows.
- Where count thresholds exist, baseline by business unit or asset class before enabling notable actions.
