title: Suspicious Azure AD Application Registration
id: SPLK-RESDEV-0001
source_id: SENT-RESDEV-0001
status: production
description: Detects creation of Azure AD or Entra ID application registrations that may support malicious resource development or persistence.
author: Adam Ring
date: '2026-03-06'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: azure
  category: audit
source_table: AuditLogs
search: '`azure_auditlogs`

  | eval op_l=lower(OperationName)

  | where like(op_l, "%add application%") OR like(op_l, "%add service principal%") OR like(op_l, "%update application%")

  | spath input=InitiatedBy path=user.userPrincipalName output=InitiatedByUPN

  | table TimeGenerated OperationName Result InitiatedByUPN TargetResources'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: high
risk_score: 70
tactics:
- Resource Development
- Persistence
techniques:
- T1583.006
- T1098
kill_chain_phases:
- Resource Development
data_sources:
- AuditLogs
falsepositives:
- Approved application onboarding
- Legitimate cloud engineering or identity administration
- Normal dev/test tenant setup activity
triage:
- Manual validation is still required for this rule because the original KQL relied on complex joins, dynamic arrays, or source-specific cloud fields.
- Review the application name, owner, credentials, and permissions
- Determine whether the initiator normally registers applications
- Inspect follow-on service principal, secret, or consent activity
- Check whether the app appears newly operationalized or overprivileged
validation:
- Register a lab application and confirm the analytic triggers
lifecycle: production
owner: Detection Engineering
tags:
- attack.resource-development
- attack.persistence
- attack.t1583.006
- attack.t1098
- azure-ad
- app-registration
- sentinel
- splunk
- converted-from-sentinel
production_tuning:
- Validate macro scope, time range, and field aliases in a non-production search head first.
- Tune known-good parent processes, service accounts, management hosts, and software deployment workflows.
- Where count thresholds exist, baseline by business unit or asset class before enabling notable actions.
