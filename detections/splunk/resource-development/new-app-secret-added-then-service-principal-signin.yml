title: New App Secret Added Then Service Principal Sign-In
id: SPLK-RESDEV-0007
source_id: SENT-RESDEV-0007
status: testing
description: Detects application secret or key credential creation followed shortly by service principal sign-in, intended to surface suspicious cloud application operationalization after credential creation.
author: Adam Ring
date: '2026-03-20'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: entra_id
  service: audit_and_sign_in
source_table: AuditLogs
search: '`azure_auditlogs`

  | where OperationName IN ("Add password credential", "Add key credential")

  | eval __translation_note="Manual review required for: | mv-expand TargetResources"

  | eval AppName=TargetResources.displayName

  | rename TimeGenerated as SecretTime

  | table SecretTime, InitiatedBy, AppName, OperationName, Result

  | eval __translation_note="Manual review required for final pipeline: | join kind=inner spSignins on $left.AppName == $right.AppDisplayName

  | eval __window_end=relative_time(SecretTime, "+4h")

  | where SigninTime>=SecretTime AND SigninTime<=__window_end

  | fields - __window_end

  | table SecretTime, SigninTime, AppName, OperationName, InitiatedBy, IPAddress, ResourceDisplayName, ResultType"'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: high
risk_score: 84
tactics:
- Resource Development
- Persistence
techniques:
- T1528
- T1098
kill_chain_phases:
- Resource Development
- Persistence
data_sources:
- AuditLogs
- SigninLogs
falsepositives:
- Approved application onboarding and secret rotation
- Legitimate service principal activation shortly after key rotation
triage:
- Manual validation is still required for this rule because the original KQL relied on complex joins, dynamic arrays, or source-specific cloud fields.
- Validate whether the app owner and credential addition were approved
- Review the timing between secret creation and service principal activity
- Check what resources the app accessed after sign-in
- Determine whether the app was newly created, overprivileged, or tied to suspicious consent activity
validation:
- Test with a controlled app secret rotation and service principal sign-in
lifecycle: testing
owner: Detection Engineering
tags:
