title: User Click Spike to Suspicious Domain
id: SPLK-RESDEV-0003
source_id: SENT-RESDEV-0003
status: production
description: Flags repeated user clicks to the same destination domain, which may indicate attacker-controlled infrastructure used for phishing or campaign staging.
author: Adam Ring
date: '2026-03-06'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: microsoft365
  category: web
source_table: UrlClickEvents
search: '`microsoft_defender_url_click_events`

  | where ActionType="ClickAllowed"

  | rex field=Url "https?://(?<Domain>[^/]+)"

  | bin Timestamp span=1d

  | stats count as Clicks dc(AccountUpn) as Users values(Url) as SampleUrls by Domain Timestamp

  | where Clicks>=5 AND Users>=3

  | table Timestamp Domain Clicks Users SampleUrls'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: medium
risk_score: 55
tactics:
- Resource Development
- Initial Access
techniques:
- T1583.001
- T1566.002
kill_chain_phases:
- Resource Development
- Delivery
data_sources:
- UrlClickEvents
falsepositives:
- Marketing or internal campaign links
- Legitimate external services accessed by many users
- Popular SaaS domains newly introduced to the environment
triage:
- Manual validation is still required for this rule because the original KQL relied on complex joins, dynamic arrays, or source-specific cloud fields.
- Review the domain, sender context, and related message campaign data
- Determine whether the domain is newly observed, newly registered, or otherwise suspicious
- Check for credential harvesting, OAuth lure clicks, or device-code sign-ins afterward
- Validate whether the same domain appears in user reports or security tooling
validation:
- Validate URL parsing and threshold behavior with benign click data
lifecycle: production
owner: Detection Engineering
