title: Bulk Mailbox or Inbox Rule Creation Activity
id: SPLK-RESDEV-0002
source_id: SENT-RESDEV-0002
status: production
description: Detects bursts of mailbox or inbox-rule creation activity that may support phishing infrastructure setup, tenant staging, or suspicious mail workflow manipulation.
author: Adam Ring
date: '2026-03-06'
modified: '2026-03-26'
platform: splunk
query_language: spl
logsource:
  product: microsoft365
  category: audit
source_table: OfficeActivity
search: '`m365_office_activity`

  | where Operation IN ("New-InboxRule","Set-InboxRule","New-Mailbox")

  | bin TimeGenerated span=30m

  | stats count as ActivityCount values(Operation) as Operations by UserId TimeGenerated

  | where ActivityCount>=5

  | table TimeGenerated UserId ActivityCount Operations'
how_to_implement:
- Map the source macro to your production indexes, sourcetypes, or datamodel-backed acceleration.
- Prefer Splunk CIM field aliases where possible and validate original Microsoft field names before deployment.
- Deploy with asset- and user-based allowlists for admin tools, software distribution, sanctioned automation, and IT support activity.
- Start as a scheduled correlation search with a limited lookback and suppression window, then raise to notable only after baselining.
severity: medium
risk_score: 60
tactics:
- Resource Development
- Persistence
techniques:
- T1585
- T1098
kill_chain_phases:
- Resource Development
data_sources:
- OfficeActivity
falsepositives:
- Mail migration activity
- Bulk administrative mailbox changes
- Approved mailbox routing or tenant onboarding work
triage:
- Manual validation is still required for this rule because the original KQL relied on complex joins, dynamic arrays, or source-specific cloud fields.
- Review which mailboxes or inbox rules were created or modified
- Validate whether the initiator is an authorized Exchange administrator
- Determine whether the rules support forwarding, hiding, or deletion behavior
- Check for related phishing setup, suspicious sign-ins, or app registration activity
validation:
- Create multiple test inbox rules and mailbox objects in a lab tenant and tune thresholds
lifecycle: production
owner: Detection Engineering
tags:
- attack.resource-development
- attack.persistence
- attack.t1585
- attack.t1098
- m365
- mailbox
- inbox-rule
- sentinel
- splunk
- converted-from-sentinel
production_tuning:
- Validate macro scope, time range, and field aliases in a non-production search head first.
- Tune known-good parent processes, service accounts, management hosts, and software deployment workflows.
- Where count thresholds exist, baseline by business unit or asset class before enabling notable actions.
